<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SD Radar · Immo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  /* Style « Doux » : fond bleu clair, cartes blanches arrondies, jaune en accent. Daltonisme :
     jamais rouge/vert pour distinguer ; chaque pile a une couleur vive ET son nom écrit, et les
     valeurs se lisent par une position sur une jauge. */
  :root { --fond:#e6f1fd; --carte:#ffffff; --texte:#1b2737; --doux:#55657a; --ligne:#c9d8ea; --creux:#f3f8fe;
          --jaune:#ffd23f; --jaune-fonce:#7a5a00; --prio:#1f5fd6; --tran:#b85c00; --disc:#7c3fe0; --ecar:#6b7889; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--fond); color:var(--texte); font:16px/1.4 Nunito, system-ui, sans-serif; }
  body { padding-bottom:calc(76px + env(safe-area-inset-bottom)); }
  h1, h2, h3, .titre-app { font-family:Fredoka, Nunito, sans-serif; font-weight:600; }
  button, input, select, textarea { font:inherit; }
  button { cursor:pointer; }
  .haut { background:var(--fond); padding:10px 14px 6px; }
  .titre-app { font-size:20px; display:flex; justify-content:space-between; align-items:center; }
  .titre-app small { font-family:Nunito; font-size:13px; color:var(--doux); font-weight:600; }
  /* critères */
  .criteres { background:var(--carte); border-radius:18px; margin:8px 0; box-shadow:0 1px 0 var(--ligne); }
  .criteres > button { width:100%; display:flex; justify-content:space-between; align-items:center; gap:8px; padding:12px 14px;
                       border:0; background:transparent; color:var(--texte); text-align:left; font-weight:700; }
  .criteres .resume { font-weight:600; color:var(--doux); font-size:13px; }
  .compteur { font-family:Fredoka; font-size:18px; white-space:nowrap; }
  .reglages-crit { display:none; padding:0 14px 14px; gap:12px; flex-direction:column; }
  .reglages-crit.ouvert { display:flex; }
  .curseur { display:grid; grid-template-columns:1fr auto; gap:2px 10px; align-items:center; }
  .curseur label { font-weight:700; font-size:14px; }
  .curseur output { font-family:Fredoka; font-size:16px; }
  .curseur input[type=range] { grid-column:1 / 3; width:100%; accent-color:var(--prio); height:28px; }
  .curseur .elim { grid-column:1 / 3; font-size:12px; color:var(--doux); }
  .cases { display:flex; gap:8px; flex-wrap:wrap; }
  .cases label { display:flex; align-items:center; gap:6px; padding:6px 10px; border:2px solid var(--ligne); border-radius:12px; font-size:14px; font-weight:700; }
  .lien-defaut { align-self:flex-start; border:0; background:transparent; color:var(--prio); font-weight:800; text-decoration:underline; padding:4px 0; }
  /* piles */
  .piles { display:flex; gap:8px; overflow-x:auto; padding:4px 0 6px; scrollbar-width:none; }
  .piles::-webkit-scrollbar { display:none; }
  .pile { flex:none; display:flex; align-items:center; gap:6px; height:40px; padding:0 14px; border-radius:20px; border:2px solid var(--c);
          background:var(--carte); color:var(--texte); font-weight:800; font-size:14px; }
  .pile .n { background:var(--c); color:#fff; border-radius:10px; padding:0 8px; font-size:13px; line-height:22px; }
  .pile[aria-pressed="true"] { background:var(--c); color:#fff; }
  .pile[aria-pressed="true"] .n { background:#fff; color:var(--c); }
  .p-prioritaires { --c:var(--prio); } .p-a_trancher { --c:var(--tran); } .p-a_discuter { --c:var(--disc); } .p-ecartees { --c:var(--ecar); }
  .ajouter { width:100%; margin:6px 0 2px; min-height:46px; border-radius:16px; border:2px dashed var(--prio); background:transparent; color:var(--prio); font-weight:800; }
  main { padding:4px 14px 20px; display:flex; flex-direction:column; gap:12px; max-width:720px; margin:0 auto; }
  .haut-inner { max-width:720px; margin:0 auto; }
  /* carte d'annonce */
  .carte { background:var(--carte); border-radius:20px; overflow:hidden; box-shadow:0 2px 0 var(--ligne); border-left:8px solid var(--c); }
  .carte .tete { display:flex; gap:12px; padding:12px 12px 0; cursor:pointer; }
  .carte .vignette { width:84px; height:84px; border-radius:14px; background:var(--creux) center/cover no-repeat; flex:none; display:flex; align-items:center; justify-content:center; color:var(--doux); font-size:12px; text-align:center; }
  .carte .txt { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .carte h3 { margin:0; font-size:16px; line-height:1.25; word-break:break-word; }
  .carte .sous { font-size:14px; color:var(--doux); }
  .carte .prix { font-size:15px; font-weight:800; }
  .etiq { display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:800; padding:2px 8px; border-radius:8px; border:2px solid var(--c); color:var(--texte); background:#fff; }
  .etiq.plein { background:var(--c); color:#fff; }
  .etiq.jaune { --c:var(--jaune); background:var(--jaune); color:#3b2b00; }
  .corps { padding:8px 12px 12px; display:flex; flex-direction:column; gap:8px; }
  .ligne-val { display:flex; justify-content:space-between; gap:8px; font-size:14px; flex-wrap:wrap; }
  .ligne-val b { font-weight:800; }
  .jauge { position:relative; height:28px; margin:2px 6px 0; }
  .jauge .rail { position:absolute; left:0; right:0; top:12px; height:4px; background:var(--ligne); border-radius:2px; }
  .jauge .bande { position:absolute; top:9px; height:10px; background:#9cb3cf; border-radius:5px; }
  .jauge .med { position:absolute; top:5px; width:3px; height:18px; background:var(--texte); border-radius:2px; }
  .jauge .point { position:absolute; top:3px; width:22px; height:22px; margin-left:-11px; border-radius:11px; background:var(--jaune); border:3px solid var(--texte); }
  .jauge-leg { display:flex; justify-content:space-between; font-size:12px; color:var(--doux); margin:0 2px; }
  .verdict { font-weight:800; }
  .sep { border:0; border-top:2px dotted var(--ligne); margin:2px 0; }
  .motifs { font-size:13px; color:var(--doux); }
  .actions { display:flex; gap:8px; }
  .actions button { flex:1; min-height:44px; border-radius:14px; font-weight:800; font-size:14px; border:2px solid var(--texte); background:#fff; color:var(--texte); }
  .actions .garder { background:var(--texte); color:#fff; }
  .actions .fait { outline:3px solid var(--jaune); }
  .motif-choix { display:none; flex-wrap:wrap; gap:6px; }
  .motif-choix.ouvert { display:flex; }
  .motif-choix button { min-height:38px; padding:0 12px; border-radius:12px; border:2px solid var(--ligne); background:#fff; font-weight:700; font-size:13px; }
  .vide { text-align:center; color:var(--doux); padding:30px 10px; }
  /* fiche détail */
  #fiche { position:fixed; inset:0; background:var(--fond); z-index:20; overflow-y:auto; display:none; }
  #fiche.ouvert { display:block; }
  #fiche .barre { position:sticky; top:0; background:var(--fond); padding:10px 14px; display:flex; gap:10px; align-items:center; z-index:2; }
  #fiche .barre button { min-height:44px; padding:0 14px; border-radius:14px; border:2px solid var(--texte); background:#fff; font-weight:800; }
  #fiche .contenu { padding:0 14px 40px; display:flex; flex-direction:column; gap:12px; max-width:720px; margin:0 auto; }
  .bloc { background:var(--carte); border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .bloc h2 { margin:0; font-size:18px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { padding:6px 4px; border-bottom:1px solid var(--ligne); text-align:left; vertical-align:top; }
  td.n, th.n { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  tr.total td { font-weight:800; border-bottom:0; }
  .petit { font-size:12px; color:var(--doux); }
  table.serre { font-size:13px; } table.serre td, table.serre th { padding:5px 2px; }
  #fiche .barre button { white-space:nowrap; }
  .graph { width:100%; height:auto; }
  .leg { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; }
  .leg span { display:inline-flex; align-items:center; gap:6px; }
  .trait { display:inline-block; width:26px; height:0; border-top:4px solid var(--prio); }
  .trait.tirets { border-top:4px dashed var(--tran); }
  .barre-score { height:12px; background:var(--creux); border-radius:6px; overflow:hidden; border:1px solid var(--ligne); }
  .barre-score > div { height:100%; background:var(--prio); }
  ul.q { margin:0; padding-left:20px; } ul.q li { margin:4px 0; }
  a.lien { color:var(--prio); font-weight:800; }
  /* sous-onglets */
  nav.bas { position:fixed; left:0; right:0; bottom:0; background:#fff; display:flex; justify-content:space-around; padding:6px 6px calc(8px + env(safe-area-inset-bottom)); box-shadow:0 -1px 0 var(--ligne); z-index:6; }
  nav.bas button { flex:1; border:0; background:transparent; padding:10px 4px; font-weight:800; font-size:14px; color:var(--doux); border-radius:12px; }
  nav.bas button[aria-pressed="true"] { background:var(--jaune); color:#3b2b00; }
  .champ { display:flex; flex-direction:column; gap:4px; font-weight:700; font-size:14px; }
  .champ input, .champ textarea, .champ select { border:2px solid var(--ligne); border-radius:12px; padding:10px; background:#fff; color:var(--texte); font-weight:600; }
  .bouton { min-height:46px; border-radius:14px; border:2px solid var(--texte); background:var(--texte); color:#fff; font-weight:800; padding:0 16px; }
  .bouton.clair { background:#fff; color:var(--texte); }
  #toast { position:fixed; left:14px; right:14px; bottom:calc(84px + env(safe-area-inset-bottom)); background:var(--texte); color:#fff; border-radius:14px; padding:12px 14px; font-weight:700; display:none; z-index:30; }
  @media (min-width:900px) { main, .haut-inner, #fiche .contenu { max-width:900px; } .liste-cartes { display:grid; grid-template-columns:1fr 1fr; gap:12px; } }
</style>
</head>
<body>
<div class="haut"><div class="haut-inner">
  <div class="titre-app"><span id="titre">Immo · viager</span><small id="etat-donnees"></small></div>
  <div id="zone-annonces">
    <div class="criteres">
      <button id="b-criteres" aria-expanded="false"><span><span>Critères ▾</span><br><span class="resume" id="resume"></span></span>
        <span class="compteur" id="compteur"></span></button>
      <div class="reglages-crit" id="reglages-crit"></div>
    </div>
    <div class="piles" id="piles" role="tablist" aria-label="Piles"></div>
  </div>
</div></div>
<main id="main"></main>
<div id="fiche" role="dialog" aria-label="Fiche détaillée"><div class="barre"><button id="f-fermer">← Retour</button><b id="f-titre"></b></div><div class="contenu" id="f-contenu"></div></div>
<nav class="bas" aria-label="Sous-onglets Immo">
  <button data-vue="annonces" aria-pressed="true">Annonces</button>
  <button data-vue="portefeuille" aria-pressed="false">Portefeuille</button>
  <button data-vue="suivi" aria-pressed="false">Suivi</button>
  <button data-vue="chasseur" aria-pressed="false">Chasseur</button>
  <button data-vue="reglages" aria-pressed="false">Réglages</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<script src="immo.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = x => x === null || x === undefined ? '—' : Math.round(x).toLocaleString('fr-FR') + ' €';
const pc = (x, signe = true) => x === null || x === undefined ? '—' : (signe && x >= 0 ? '+' : '') + Math.round(x * 100) + ' %';
const ans = x => x === null || x === undefined ? '—' : Number(x).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' ans';
const keur = x => x === null || x === undefined ? '—' : (Math.round(x / 100) / 10).toLocaleString('fr-FR') + ' k€';
const pc1 = x => x === null || x === undefined ? '—' : (x * 100).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' %';
function lireLS(cle, defaut) { try { return JSON.parse(localStorage.getItem(cle)) ?? defaut; } catch (e) { return defaut; } }
function ecrireLS(cle, v) { try { localStorage.setItem(cle, JSON.stringify(v)); } catch (e) { /* mémoire pleine : sans gravité */ } }
function toast(t) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => el.style.display = 'none', 2600); }

// --- Données : Supabase (lien du téléphone, partagé avec Matos), serveur local, ou fichier de démonstration
const CFG = lireLS('sdradar_cfg', null);
const LOCAL = /^(localhost|127\.|192\.168\.|10\.)/.test(location.hostname);
async function rpc(nom, args) {
  const r = await fetch(`${CFG.u}/rest/v1/rpc/${nom}`, { method: 'POST', signal: AbortSignal.timeout(40000),
    headers: { apikey: CFG.k, Authorization: 'Bearer ' + CFG.k, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_jeton: CFG.t, ...args }) });
  if (!r.ok) throw new Error('Supabase ' + r.status);
  return r.status === 204 ? null : r.json();
}
async function envoyer(action, args) {   // décision, suivi, ajout : réseau, sinon file d'attente
  const file = lireLS('sdradar_immo_file', []); file.push({ action, args }); ecrireLS('sdradar_immo_file', file);
  await viderFile();
}
let envoiEnCours = false;
async function viderFile() {   // un seul envoi à la fois ; la file est relue à chaque tour
  if (envoiEnCours) return;
  envoiEnCours = true;
  try { await viderFileUneFois(); } finally { envoiEnCours = false; }
  if (lireLS('sdradar_immo_file', []).length && navigator.onLine !== false) setTimeout(viderFile, 30000);
}
async function viderFileUneFois() {
  for (;;) {
    const file = lireLS('sdradar_immo_file', []);
    if (!file.length) return;
    const { action, args } = file[0];
    try {
      if (CFG) await rpc((action.startsWith('chasse_') ? 'radar_' : 'radar_viager_') + action, args);
      else if (LOCAL) { const r = await fetch('/api/viager/' + action, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(args) }); if (!r.ok) throw new Error(r.status); }
      else return;  // démonstration : rien n'est envoyé
    } catch (e) { return; }
    ecrireLS('sdradar_immo_file', lireLS('sdradar_immo_file', []).slice(1));
  }
}
let D = { annonces: [], regles: null, reglages: {} };
async function charger() {
  try {
    if (window.IMMO_DONNEES) D = window.IMMO_DONNEES;
    else if (CFG) D = await rpc('radar_viager_lire', {});
    else if (LOCAL) D = await (await fetch('/api/viager')).json();
    else throw new Error('pas d’accès : ouvre d’abord l’onglet Matos pour configurer le téléphone');
    // Cache sans les Écartées : le stockage du téléphone est partagé avec Matos (audit I9).
    ecrireLS('sdradar_immo_cache', { ...D, annonces: D.annonces.filter(a => a.pile_defaut !== 'ecartees') });
    $('etat-donnees').textContent = window.IMMO_DONNEES ? 'démonstration' : (D.dernier_passage ? 'passage du ' + String(D.dernier_passage.debut || '').slice(0, 10) : '');
  } catch (e) {
    const c = lireLS('sdradar_immo_cache', null);
    if (c) { D = c; $('etat-donnees').textContent = 'hors ligne (dernières données)'; }
    else { $('main').innerHTML = `<p class="vide">Impossible de charger les annonces : ${esc(e.message)}</p>`; return; }
  }
  REGLES = fusion(JSON.parse(JSON.stringify(D.regles || {})), lireLS('sdradar_immo_reglages', null) || D.reglages || {});
  CRIT = fusion(JSON.parse(JSON.stringify(REGLES.criteres || {})), lireLS('sdradar_immo_criteres', {}));
  const dec = lireLS('sdradar_immo_decisions', {}), sui = lireLS('sdradar_immo_suivi', {});
  for (const a of D.annonces) {
    if (a.decision && !dec[a.id]) dec[a.id] = a.decision;
    if (a.suivi && !sui[a.id]) sui[a.id] = a.suivi;
  }
  ecrireLS('sdradar_immo_decisions', dec); ecrireLS('sdradar_immo_suivi', sui);
  viderFile();
  rendre();
}
function fusion(base, dessus) { for (const [k, v] of Object.entries(dessus || {})) { if (v && typeof v === 'object' && !Array.isArray(v) && base[k] && typeof base[k] === 'object') fusion(base[k], v); else base[k] = v; } return base; }

// --- État de l'écran
let REGLES = null, CRIT = null, TRI = null;
let pileVue = lireLS('sdradar_immo_pile', 'prioritaires');
let vue = 'annonces';
const decisions = () => lireLS('sdradar_immo_decisions', {});
function regleCourante() { return { criteres: CRIT, tri: REGLES.tri }; }

const CURSEURS = [
  ['age_min_une_tete', 'Âge minimum (1 tête)', 70, 95, 1, ' ans'],
  ['age_min_deux_tetes_chacune', 'Âge minimum de chacune (2 têtes)', 70, 95, 1, ' ans'],
  ['age_min_exclusion', 'Exclure toute tête de moins de', 60, 95, 1, ' ans'],
  ['bouquet_max_eur', 'Bouquet maximum', 0, 150000, 5000, ' €'],
  ['rente_max_eur_mois', 'Rente maximum par mois', 0, 2000, 50, ' €'],
];
function resumeCriteres() {
  return `Âge ≥ ${CRIT.age_min_une_tete} · 2 têtes ≥ ${CRIT.age_min_deux_tetes_chacune} · Bouquet ≤ ${Math.round(CRIT.bouquet_max_eur / 1000)} k€ · Rente ≤ ${CRIT.rente_max_eur_mois} €`;
}
function construireCriteres() {
  const z = $('reglages-crit');
  z.innerHTML = CURSEURS.map(([k, lib, mi, ma, pas, u]) => `<div class="curseur"><label for="c-${k}">${lib}</label>
      <output id="o-${k}">${Number(CRIT[k]).toLocaleString('fr-FR')}${u}</output>
      <input type="range" id="c-${k}" min="${mi}" max="${ma}" step="${pas}" value="${CRIT[k]}"><span class="elim" id="e-${k}"></span></div>`).join('')
    + `<div class="cases"><label><input type="checkbox" id="c-deux" ${CRIT.deux_tetes_acceptees ? 'checked' : ''}> 2 têtes acceptées</label>
       <label><input type="checkbox" id="c-occupe" ${CRIT.types_vente.includes('occupe') ? 'checked' : ''}> occupé</label>
       <label><input type="checkbox" id="c-libre" ${CRIT.types_vente.includes('libre') ? 'checked' : ''}> libre</label>
       <label><input type="checkbox" id="c-terme" ${CRIT.types_vente.includes('terme') ? 'checked' : ''}> vente à terme</label></div>
       <span class="petit" id="e-autres"></span>
       <button class="lien-defaut" id="c-defaut">Revenir aux critères par défaut</button>`;
  CURSEURS.forEach(([k, , , , , u]) => { $('c-' + k).oninput = ev => { CRIT[k] = Number(ev.target.value); $('o-' + k).textContent = CRIT[k].toLocaleString('fr-FR') + u; changer(); }; });
  $('c-deux').onchange = ev => { CRIT.deux_tetes_acceptees = ev.target.checked; changer(); };
  ['occupe', 'libre', 'terme'].forEach(t => $('c-' + t).onchange = ev => {
    CRIT.types_vente = ev.target.checked ? [...new Set([...CRIT.types_vente, t])] : CRIT.types_vente.filter(x => x !== t); changer(); });
  $('c-defaut').onclick = () => { CRIT = JSON.parse(JSON.stringify(REGLES.criteres)); ecrireLS('sdradar_immo_criteres', {}); construireCriteres(); changer(); };
}
function changer() { ecrireLS('sdradar_immo_criteres', CRIT); rendreAnnonces(); }

function trierTout() {
  const visibles = D.annonces;  // les retirées restent consultables, en « À trancher »
  TRI = Immo.trier(regleCourante(), visibles.map(a => a.metriques));
  visibles.forEach((a, i) => { a._pile = TRI.piles[i][0]; a._motifs = TRI.piles[i][1]; });
  return visibles;
}
function rendre() {
  document.querySelectorAll('nav.bas button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.vue === vue)));
  $('zone-annonces').style.display = vue === 'annonces' ? '' : 'none';
  if (vue === 'annonces') { if (!$('c-age_min_une_tete')) construireCriteres(); rendreAnnonces(); }
  else if (vue === 'portefeuille') (window.vuePortefeuille || attente)('Portefeuille');
  else if (vue === 'suivi') (window.vueSuivi || attente)('Suivi');
  else if (vue === 'chasseur') (window.vueChasseur || attente)('Chasseur');
  else (window.vueReglages || attente)('Réglages');
}
function attente(nom) { $('main').innerHTML = `<p class="vide">${nom} : à venir.</p>`; }
const LIB = { prioritaires: 'Prioritaires', a_trancher: 'À trancher', a_discuter: 'À discuter', ecartees: 'Écartées' };
function rendreAnnonces() {
  const visibles = trierTout();
  const dec = decisions();
  const total = visibles.length;
  const retenues = TRI.compte.prioritaires + TRI.compte.a_trancher + TRI.compte.a_discuter;
  $('compteur').textContent = `${retenues} sur ${total}`;
  $('resume').textContent = resumeCriteres();
  const el = TRI.elimine_par;
  const libElim = { age_min_une_tete: el.age, age_min_deux_tetes_chacune: el.age, age_min_exclusion: el.age, bouquet_max_eur: el.bouquet, rente_max_eur_mois: el.rente };

function afficherPortefeuille(r, n95, n, modeType) {

}

// Lecture et verdicts faits au PC (domains/chasse_immo) ; la rue de Sarkis reste sur ce
// téléphone, dans data/state/ et Supabase (accès par jeton), jamais dans un fichier versionné.
const ARRONDISSEMENTS = Array.from({ length: 16 }, (_, i) => ['132' + String(i + 1).padStart(2, '0'), (i ? (i + 1) + 'e' : '1er') + ' arrondissement']);
const CORRESPOND = { 'oui': ['Correspond', 'plein', 'var(--prio)'], 'à vérifier': ['À vérifier', '', 'var(--tran)'], 'non': ['Ne correspond pas', '', 'var(--ecar)'] };
let CH = null;
async function chargerChasse() {
  try {
    let r;
    if (window.IMMO_DONNEES) r = { telephone: window.IMMO_DONNEES.chasse || null };
    else if (CFG) r = await rpc('radar_chasse_lire', {});
    else if (LOCAL) r = await (await fetch('/api/chasse')).json();
    else throw new Error('pas d’accès');
    CH = r || {};
    ecrireLS('sdradar_immo_chasse_cache', CH);
  } catch (e) { CH = lireLS('sdradar_immo_chasse_cache', null) || { telephone: null }; }
  if (!lireLS('sdradar_immo_chasse_perso', null) && (CH.perso || CH.telephone?.perso?.rue)) ecrireLS('sdradar_immo_chasse_perso', CH.perso || CH.telephone.perso);
  const dec = lireLS('sdradar_immo_chasse_decisions', {});
  for (const [k, v] of Object.entries(CH.decisions || {})) if (!dec[k]) dec[k] = v;
  for (const a of CH.telephone?.annonces || []) if (a.decision && !dec[a.id]) dec[a.id] = a.decision;
  ecrireLS('sdradar_immo_chasse_decisions', dec);
}
const persoChasse = () => lireLS('sdradar_immo_chasse_perso', {}) || {};
function etiqCorrespond(c) { const [t, cl, col] = CORRESPOND[c] || CORRESPOND['à vérifier']; return `<span class="etiq ${cl}" style="--c:${col}">${t}</span>`; }
function carteChasse(a, dec) {
  const ev = a.evaluations.find(e => e.fiche === a.fiche) || a.evaluations[0] || {};
  const l = a.lecture || {}, d = dec[a.id];
  const faits = [l.types?.length ? l.types.join(', ') : null, l.transaction, l.prix ? eur(l.prix) + (l.transaction === 'location' ? ' / mois' : '') : null,
    l.unites > 1 ? l.unites + ' unités' : null, l.surface ? l.surface.toLocaleString('fr-FR') + ' m²' : null,
    l.code_postal, ev.prix_unite ? eur(ev.prix_unite) + ' la place' : null,
    ev.distance_m !== null && ev.distance_m !== undefined ? '≈ ' + Math.round(ev.distance_m / 10) * 10 + ' m de chez toi' : null].filter(Boolean);
  return `<div class="bloc" data-cid="${esc(a.id)}" style="${d === 'ecarter' ? 'opacity:.6' : ''}">
    <div class="actions" style="align-items:center">${etiqCorrespond(a.correspond)}<b>${esc(ev.nom || '')}</b>${d ? `<span class="etiq">${d === 'garder' ? 'gardée' : 'écartée'}</span>` : ''}${ev.verdict ? `<span class="etiq">${esc(ev.verdict)}</span>` : ''}</div>
    <div class="petit">${esc(faits.join(' · '))}</div>
    <div>${esc(a.extrait)}${a.extrait.length >= 280 ? '…' : ''}</div>
    ${(ev.motifs || []).length ? '<ul class="q">' + ev.motifs.map(m => `<li>${esc(m)}</li>`).join('') + '</ul>' : ''}
    <div class="actions"><button class="bouton" data-cdec="garder">Garder</button><button class="bouton clair" data-cdec="ecarter">Écarter</button>${a.url ? `<button class="bouton clair" data-clien>Ouvrir l'annonce</button>` : ''}</div>
    <span class="petit">${esc(a.origine || '')}${a.le ? ' · ' + esc(String(a.le).slice(0, 10)) : ''}</span></div>`;
}
window.vueChasseur = async function () {
  if (!CH) { $('main').innerHTML = '<p class="vide">Chargement…</p>'; await chargerChasse(); }
  if (vue !== 'chasseur') return;
  const T = CH.telephone, perso = persoChasse(), dec = lireLS('sdradar_immo_chasse_decisions', {});
  const fiches = T?.fiches || [];
  const fl = fiches.find(f => f.id === 'local_etuis') || {}, fp = fiches.find(f => f.id === 'lots_parkings') || {};
  const reg = perso.fiches || {};
  const rayon = reg.local_etuis?.rayon_m ?? fl.rayon_m ?? 500;
  const ratio = reg.lots_parkings?.prix_unite_max_fois_reference ?? fp.prix_unite_max_fois_reference ?? 0.85;
  let h = `<button class="ajouter" id="ch-ajouter">+ Coller une annonce</button>`;
  h += `<div class="bloc"><h2>Ta rue</h2>
    <p class="petit">Sert à mesurer la distance d'un local à chez toi. Elle reste sur ce téléphone, sur le PC et dans ta base privée ; jamais dans un fichier du projet ni envoyée ailleurs.</p>
    <label class="champ">Rue<input id="ch-rue" maxlength="120" value="${esc(perso.rue || '')}" placeholder="ex. rue de la République"></label>
    <label class="champ">Arrondissement<select id="ch-commune"><option value="">—</option>${ARRONDISSEMENTS.map(([c, n]) => `<option value="${c}" ${perso.commune === c ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <div class="curseur"><label for="ch-rayon">Local pour les étuis : distance maximum</label><output id="o-ch-rayon">${rayon} m</output><input id="ch-rayon" type="range" min="100" max="2000" step="50" value="${rayon}"></div>
    <div class="curseur"><label for="ch-ratio">Lots de parkings : « bon prix » jusqu'à</label><output id="o-ch-ratio">${Math.round(ratio * 100)} % du prix réel</output><input id="ch-ratio" type="range" min="0.5" max="0.95" step="0.05" value="${ratio}"></div>
    <button class="bouton" id="ch-enregistrer">Enregistrer</button></div>`;
  if (!T) {
    h += '<p class="vide">Pas encore de données du chasseur : elles arrivent au prochain passage du PC.</p>';
    $('main').innerHTML = h; brancherChasse(); return;
  }
  const liste = T.annonces || [];
  const n = c => liste.filter(a => a.correspond === c).length;
  h += `<div class="bloc"><h2>Annonces lues</h2><div class="petit">${n('oui')} correspondent · ${n('à vérifier')} à vérifier · ${n('non')} ne correspondent pas${T.maj ? ' · mis à jour le ' + esc(T.maj) : ''}</div>
    ${liste.length ? '' : '<div>Aucune pour l\'instant. Colle une annonce (Leboncoin, PAP, agence…) ou classe tes alertes e-mail sous le libellé Gmail « IMMO/chasse ».</div>'}</div>`;
  h += liste.filter(a => a.correspond !== 'non' || dec[a.id] === 'garder').map(a => carteChasse(a, dec)).join('');
  const non = liste.filter(a => a.correspond === 'non' && dec[a.id] !== 'garder');
  if (non.length) h += `<details class="bloc"><summary><b>${non.length} qui ne correspondent pas</b></summary>${non.map(a => carteChasse(a, dec)).join('')}</details>`;
  h += `<div class="bloc"><h2>Prix réels des places (DVF, 3 ans)</h2>
    <span class="petit">Ventes de dépendances seules (parking, box, garage, cave : DVF ne les distingue pas), prix par place. « Lots » = ventes de 2 places ou plus d'un coup.</span>
    <table><tr><th>Secteur</th><th class="n">Toutes ventes</th><th class="n">Lots</th></tr>${(T.references || []).map(r => `<tr><td>${esc(r.nom)}</td>
      <td class="n">${r.toutes ? eur(r.toutes.mediane) + `<br><span class="petit">${r.toutes.n} ventes</span>` : '—'}</td>
      <td class="n">${r.lots ? '<b>' + eur(r.lots.mediane) + `</b><br><span class="petit">${r.lots.n} ventes</span>` : '—'}</td></tr>`).join('')}</table></div>`;
  if ((T.lots_recents || []).length) h += `<div class="bloc"><h2>Lots vendus ces 2 ans, du moins cher à la place</h2>
    <table><tr><th>Date · lieu</th><th class="n">Places</th><th class="n">Prix / place</th></tr>${T.lots_recents.map(v => `<tr><td>${esc(v.date.slice(0, 7))} · ${esc(v.commune)}<br><span class="petit">${esc(v.voie || '')}</span></td><td class="n">${v.unites}</td><td class="n">${eur(v.prix_unite)}<br><span class="petit">${eur(v.prix)} en tout</span></td></tr>`).join('')}</table></div>`;
  h += `<div class="bloc"><h2>Ce que cherche le chasseur</h2>${fiches.map(f => `<div><b>${esc(f.nom)}</b><br><span class="petit">${esc(f.description || '')}</span></div>`).join('')}
    <span class="petit">Aucune collecte automatique : Leboncoin interdit les robots. Les annonces viennent de ce que tu colles et de tes alertes e-mail.</span></div>`;
  $('main').innerHTML = h; brancherChasse();
};
function brancherChasse() {
  $('ch-ajouter').onclick = ecranAjoutChasse;
  $('ch-rayon').oninput = e => { $('o-ch-rayon').textContent = e.target.value + ' m'; };
  $('ch-ratio').oninput = e => { $('o-ch-ratio').textContent = Math.round(e.target.value * 100) + ' % du prix réel'; };
  $('ch-enregistrer').onclick = () => {
    const v = { rue: $('ch-rue').value.trim() || null, commune: $('ch-commune').value || null,
      fiches: { local_etuis: { rayon_m: Number($('ch-rayon').value) }, lots_parkings: { prix_unite_max_fois_reference: Number($('ch-ratio').value) } } };
    ecrireLS('sdradar_immo_chasse_perso', v); envoyer('chasse_perso', { p_valeur: v });
    toast('Enregistré : pris en compte au prochain passage');
  };
  document.querySelectorAll('#main [data-cid]').forEach(b => {
    const id = b.dataset.cid, a = (CH.telephone?.annonces || []).find(x => x.id === id);
    b.querySelectorAll('[data-cdec]').forEach(x => x.onclick = () => {
      const dec = lireLS('sdradar_immo_chasse_decisions', {}); dec[id] = x.dataset.cdec; ecrireLS('sdradar_immo_chasse_decisions', dec);
      envoyer('chasse_decider', { p_id: id, p_decision: x.dataset.cdec }); window.vueChasseur();
    });
    const l = b.querySelector('[data-clien]'); if (l && a) l.onclick = () => window.open(a.url, '_blank', 'noopener');
  });
}
function ecranAjoutChasse() {
  $('main').innerHTML = `<div class="bloc"><h2>Coller une annonce (chasseur)</h2>
    <p class="petit">Colle le texte complet : type de bien, prix, nombre de places, rue ou quartier, code postal. Une adresse seule ne suffit pas (Leboncoin ne se lit pas automatiquement). Lue au prochain passage du PC.</p>
    <label class="champ">Texte de l'annonce<textarea id="ch-texte" rows="8" maxlength="20000"></textarea></label>
    <label class="champ">Adresse de l'annonce (facultatif)<input id="ch-url" type="url" maxlength="2000" placeholder="https://…"></label>
    <div class="actions"><button class="bouton" id="ch-ok">Envoyer</button><button class="bouton clair" id="ch-annuler">Annuler</button></div></div>`;
  $('ch-annuler').onclick = () => window.vueChasseur();
  $('ch-ok').onclick = async () => {
    const texte = $('ch-texte').value.trim(), url = $('ch-url').value.trim();
    if (!texte) { toast('Colle le texte de l’annonce'); return; }
    if (url && !/^https?:\/\//i.test(url)) { toast('L’adresse doit commencer par https://'); return; }
    await envoyer('chasse_ajouter', { p_texte: texte, p_url: url || null });
    toast('Annonce enregistrée : lue au prochain passage'); window.vueChasseur();
  };
}
</script>
</body>
</html>
