<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SD Radar</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { --fond:#101114; --carte:#1c1e24; --texte:#f4f5f7; --doux:#b6bac4; --ligne:#3a3e48;
          --garder:#ffffff; --rejeter:#2a2d35; --accent:#ffd166; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fond); color:var(--texte); font:16px/1.35 system-ui,sans-serif;
         min-height:100dvh; display:flex; flex-direction:column; overscroll-behavior:none; }
  header { padding:12px 16px; display:flex; justify-content:space-between; align-items:center;
           border-bottom:1px solid var(--ligne); }
  header b { font-size:18px; letter-spacing:.5px; }
  #reste { color:var(--doux); font-size:14px; }
  main { flex:1; position:relative; padding:16px; display:flex; align-items:center; justify-content:center; }
  .carte { width:100%; max-width:440px; background:var(--carte); border:2px solid var(--ligne);
           border-radius:16px; padding:18px; touch-action:pan-y; user-select:none; position:relative;
           transition:transform .2s; will-change:transform; }
  .carte.glisse { transition:none; }
  .niveau { display:inline-block; font-weight:700; font-size:13px; padding:3px 10px; border-radius:6px;
            letter-spacing:.5px; }
  .niveau.solide { background:#fff; color:#101114; }
  .niveau.a_voir { background:transparent; color:var(--texte); border:2px dashed var(--doux); }
  .source { float:right; color:var(--doux); font-size:13px; }
  .cadre-photo { position:relative; margin:10px 0 0; }
  .photo { display:block; width:100%; height:auto; max-height:45vh; object-fit:contain; border-radius:10px;
           background:#000; pointer-events:none; }
  .agrandir { position:absolute; right:8px; bottom:8px; background:rgba(0,0,0,.75); color:#fff;
              border:2px solid #fff; border-radius:8px; padding:6px 10px; font:inherit; font-size:14px; }
  #visionneuse { position:fixed; inset:0; background:#000; display:none; align-items:center;
                 justify-content:center; z-index:10; }
  #visionneuse img { max-width:100%; max-height:100%; object-fit:contain; }
  #visionneuse span { position:absolute; top:14px; right:16px; color:#fff; font-size:15px;
                      border:2px solid #fff; border-radius:8px; padding:6px 10px; }
  h1 { font-size:20px; margin:12px 0 4px; word-break:break-word; }
  .lieu { color:var(--doux); font-size:14px; }
  .prix { display:flex; gap:12px; margin:14px 0; }
  .prix div { flex:1; background:#14161a; border-radius:10px; padding:10px; }
  .prix small { display:block; color:var(--doux); font-size:12px; }
  .prix strong { font-size:22px; }
  .marge strong { color:var(--accent); }
  .infos { font-size:14px; color:var(--doux); margin:0 0 12px; }
  .infos span { display:block; margin:2px 0; }
  .alerte { color:#101114; background:var(--accent); border-radius:6px; padding:3px 8px;
            font-size:13px; font-weight:600; display:inline-block; margin:2px 4px 2px 0; }
  a.voir { display:block; text-align:center; padding:12px; border:2px solid var(--texte);
           border-radius:10px; color:var(--texte); text-decoration:none; font-weight:600; }
  .etiquette { position:absolute; top:18px; padding:4px 12px; border:3px solid; border-radius:8px;
               font-weight:800; font-size:20px; opacity:0; transform:rotate(-8deg); background:var(--carte); }
  #e-garder { right:16px; color:#fff; border-color:#fff; }
  #e-rejeter { left:16px; color:var(--doux); border-style:dashed; border-color:var(--doux); }
  #e-plus_tard { left:50%; margin-left:-40px; color:var(--accent); border-color:var(--accent); }
  nav { display:flex; gap:8px; align-items:center; }
  nav button, nav select { background:transparent; color:var(--texte); border:2px solid var(--ligne);
           border-radius:8px; padding:6px 10px; font:inherit; font-size:14px; }
  nav button.on { background:#fff; color:#101114; border-color:#fff; font-weight:700; }
  .liste { width:100%; max-width:520px; align-self:flex-start; }
  .gardee { background:var(--carte); border:2px solid var(--ligne); border-radius:12px; padding:12px;
            margin-bottom:10px; display:flex; gap:10px; }
  .gardee img { width:72px; height:72px; object-fit:cover; border-radius:8px; flex:none; }
  .gardee b { display:block; font-size:15px; word-break:break-word; }
  .gardee select { margin-top:6px; background:#14161a; color:var(--texte); border:2px solid var(--ligne);
                   border-radius:8px; padding:4px 6px; font:inherit; font-size:14px; }
  .gardee a { color:var(--texte); font-size:14px; }
  footer { display:flex; gap:12px; padding:12px 16px calc(16px + env(safe-area-inset-bottom));
           justify-content:center; }
  footer button { flex:1; max-width:140px; padding:14px 0; font-size:16px; font-weight:700; border-radius:12px;
                  border:2px solid var(--texte); background:var(--rejeter); color:var(--texte); cursor:pointer; }
  footer button.r { flex:0 0 56px; }
  footer button:disabled { opacity:.35; }
  footer button.g { background:var(--garder); color:#101114; }
  .vide { text-align:center; color:var(--doux); }
  #toast { position:fixed; left:12px; right:12px; bottom:90px; background:#fff; color:#101114;
           border-radius:12px; padding:10px; display:none; gap:8px; flex-wrap:wrap; align-items:center;
           font-size:14px; font-weight:600; }
  #toast button { padding:8px 10px; border-radius:8px; border:2px solid #101114; background:#fff;
                  font-weight:700; }
</style>
</head>
<body>
<header><b>SD Radar</b>
  <nav><button id="n-trier" class="on">À trier</button><button id="n-gardees">Gardées</button><a href="japon.html" style="color:var(--texte);border:2px solid var(--ligne);border-radius:8px;padding:6px 10px;text-decoration:none;font-size:14px">¥</a>
  <select id="f-niveau"><option value="">Tous</option><option value="solide">Solides</option></select></nav>
  <span id="reste"></span></header>
<main id="scene"></main>
<footer>
  <button id="b-retour" class="r" title="Revenir à la carte précédente">↶</button>
  <button id="b-rejeter">✕ Passer</button>
  <button id="b-plus_tard">★ Plus tard</button>
  <button id="b-garder" class="g">✓ Garder</button>
</footer>
<div id="toast"></div>
<div id="visionneuse"><img alt="" referrerpolicy="no-referrer"><span>✕ Fermer</span></div>
<script>
// --- Accès aux données : serveur local (/api) ou Supabase (lien de configuration du téléphone)
const CLE_CFG = 'sdradar_cfg';
function enregistrerLien(texte) {
  const m = String(texte).match(/cfg=([\w-]+=*)/);
  if (!m) return false;
  try {
    const cfg = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')))));
    if (!cfg.u || !cfg.k || !cfg.t) return false;
    localStorage.setItem(CLE_CFG, JSON.stringify(cfg));
    return true;
  } catch (e) { return false; }
}
if (location.hash.includes('cfg=')) {
  enregistrerLien(location.hash);
  history.replaceState(null, '', location.pathname);
}
const SERVEUR_LOCAL = /^(localhost|127\.|192\.168\.|10\.)/.test(location.hostname);
let CFG = null;
try { CFG = JSON.parse(localStorage.getItem(CLE_CFG) || 'null'); } catch (e) { CFG = null; }
async function rpc(nom, args) {
  const r = await fetch(`${CFG.u}/rest/v1/rpc/${nom}`, { method: 'POST', signal: AbortSignal.timeout(40000),
    headers: { apikey: CFG.k, Authorization: 'Bearer ' + CFG.k, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_jeton: CFG.t, ...args }) });
  if (!r.ok) throw new Error('Supabase ' + r.status);
  return r.status === 204 ? null : r.json();
}
// --- Cache local : les cartes s'affichent tout de suite, même réseau lent ; les décisions prises
// hors ligne attendent dans une file et partent dès que la connexion revient.
const CLE_CACHE = 'sdradar_cache', CLE_FILE = 'sdradar_file';
function lire(cle, defaut) { try { return JSON.parse(localStorage.getItem(cle)) ?? defaut; } catch (e) { return defaut; } }
function ecrire(cle, v) { try { localStorage.setItem(cle, JSON.stringify(v)); } catch (e) { /* plein ou bloqué */ } }
let etat = lire(CLE_CACHE, null) || { cartes: [], swipes: {}, total: 0 };
const sauverEtat = () => ecrire(CLE_CACHE, etat);
async function rpcSur(nom, args) {  // écriture : si le réseau échoue, on la garde pour plus tard
  const file = lire(CLE_FILE, []);
  file.push({ nom, args }); ecrire(CLE_FILE, file);
  await viderFile();
}
let envoiEnCours = false;
async function viderFile() {
  if (envoiEnCours) return;
  envoiEnCours = true;
  try {
    let file = lire(CLE_FILE, []);
    while (file.length) {
      try { await rpc(file[0].nom, file[0].args); } catch (e) { break; }
      file = lire(CLE_FILE, []).slice(1); ecrire(CLE_FILE, file);
    }
  } finally { envoiEnCours = false; }
}
addEventListener('online', viderFile);
const ORDRE = { solide: 0, a_voir: 1 };
function aTrier(cartes, swipes) {
  const maintenant = Date.now();
  return cartes.filter(c => ORDRE[c.niveau] !== undefined)
    .filter(c => !c.enchere || Date.parse(c.enchere.fin) > maintenant).filter(c => {
    const s = swipes[c.url];
    if (!s) return true;
    return s.decision === 'plus_tard' && maintenant - Date.parse(s.le) > 24 * 3600e3;
  }).sort((a, b) => ORDRE[a.niveau] - ORDRE[b.niveau] || (b.marge_prud || 0) - (a.marge_prud || 0));
}
const api = {
  async cartes() {
    if (!CFG) return (await fetch('/api/cartes')).json();
    return aTrier(etat.cartes, etat.swipes);
  },
  async gardees() {
    if (!CFG) return (await fetch('/api/gardees')).json();
    return Object.entries(etat.swipes).filter(([, s]) => s.decision === 'garder')
      .map(([url, s]) => ({ url, statut: s.statut || 'a_contacter', le: s.le, ...(s.carte || {}) }))
      .sort((a, b) => b.le.localeCompare(a.le));
  },
  async swipe(url, decision, motif, carte) {
    if (!CFG) return fetch('/api/swipe', { method: 'POST', body: JSON.stringify({ url, decision, motif, carte }) });
    etat.swipes[url] = { decision, motif: motif || null, le: new Date().toISOString(),
      ...(decision === 'garder' ? { statut: 'a_contacter', carte: carte || {} } : {}) };
    sauverEtat();
    return rpcSur('radar_swipe', { p_url: url, p_decision: decision, p_motif: motif || null, p_carte: carte || {} });
  },
  async annuler(url) {
    if (!CFG) return fetch('/api/annuler', { method: 'POST', body: JSON.stringify({ url }) });
    delete etat.swipes[url]; sauverEtat();
    return rpcSur('radar_annuler', { p_url: url });
  },
  async statut(url, statut) {
    if (!CFG) return fetch('/api/statut', { method: 'POST', body: JSON.stringify({ url, statut }) });
    if (etat.swipes[url]) { etat.swipes[url].statut = statut; sauverEtat(); }
    return rpcSur('radar_statut', { p_url: url, p_statut: statut });
  },
};
const scene = document.getElementById('scene'), reste = document.getElementById('reste');
const toast = document.getElementById('toast');
let file = [], courante = null, dernierSwipe = null, tToast = null;
const NIVEAU = { solide: 'SOLIDE', a_voir: 'À VÉRIFIER' };
const SIGNAUX = { prix_lt_50pct_argus: 'Prix < 50 % de l’argus : méfiance (arnaque possible)' };
function finEnchere(fin) {
  const s = Math.round((Date.parse(fin) - Date.now()) / 1000);
  if (!(s > 0)) return 'terminée';
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return 'dans ' + (h >= 48 ? Math.floor(h / 24) + ' j' : h ? h + ' h ' + String(m).padStart(2, '0') : m + ' min');
}
const eur = n => Math.round(n).toLocaleString('fr-FR') + ' €';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let vue = 'trier', toutes = [], diag = 'mode serveur local';
const STATUTS = { a_contacter: 'À contacter', contacte: 'Contacté', negociation: 'En négociation',
                  achete: 'Acheté', abandonne: 'Abandonné' };
function ecranConfig() {
  reste.textContent = '';
  document.querySelector('footer').style.display = 'none';
  scene.innerHTML = `<div class="liste"><h1>Configurer le téléphone</h1>
    <p class="infos">Cette appli n'a pas encore ton accès privé (une appli ajoutée à l'écran d'accueil ne
    partage pas la configuration du navigateur). Scanne le QR affiché sur le PC
    (http://localhost:8765/telephone), fais un appui long sur le lien proposé, choisis « Copier le
    lien », puis colle-le ici.</p>
    <textarea id="lien" rows="4" style="width:100%;background:#14161a;color:#fff;border:2px solid #3a3e48;
      border-radius:8px;padding:8px" placeholder="Colle le lien ici"></textarea>
    <p><a class="voir" href="#" id="ok">Enregistrer</a></p><p class="infos" id="msg"></p></div>`;
  document.getElementById('ok').onclick = e => {
    e.preventDefault();
    if (enregistrerLien(document.getElementById('lien').value)) location.reload();
    else document.getElementById('msg').textContent = 'Lien non reconnu : il doit contenir « cfg= ».';
  };
}
async function charger() {
  if (!CFG && !SERVEUR_LOCAL) { ecranConfig(); return; }
  if (CFG) { await chargerDistant(); return; }
  try { toutes = await api.cartes(); } catch (e) { scene.innerHTML = '<p class="vide">Connexion impossible (' + esc(e.message) + ').</p>'; return; }
  filtrer();
}
function majFile() {  // nouvelles données : la carte affichée reste en tête, rien ne saute
  const n = document.getElementById('f-niveau').value;
  toutes = aTrier(etat.cartes, etat.swipes);
  const nouvelle = toutes.filter(c => !n || c.niveau === n);
  if (courante && nouvelle.some(c => c.url === courante.url)) {
    file = [courante, ...nouvelle.filter(c => c.url !== courante.url)];
    reste.textContent = file.length + ' à trier';
  } else { file = nouvelle; if (vue === 'trier') afficher(); }
}
async function chargerDistant() {
  if (etat.cartes.length) { diag = 'cache du téléphone'; toutes = aTrier(etat.cartes, etat.swipes); filtrer(); }
  else scene.innerHTML = '<p class="vide">Chargement des cartes…</p>';
  viderFile();
  try {
    const p = await rpc('radar_page', { p_debut: 0, p_n: 40 });
    const premiere = p.cartes.map(c => c.url);
    etat.swipes = p.swipes || {};
    // première page fraîche + le reste du cache (remplacé au fil des pages suivantes)
    etat.cartes = [...p.cartes, ...etat.cartes.filter(c => !premiere.includes(c.url))];
    etat.total = p.total; sauverEtat(); diag = `mode Supabase · ${p.total} cartes à trier`;
    majFile();
    let recues = p.cartes.length;
    const vues = new Set(premiere);
    while (recues < p.total) {
      const q = await rpc('radar_page', { p_debut: recues, p_n: 60 });
      if (!q.cartes.length) break;
      q.cartes.forEach(c => vues.add(c.url));
      recues += q.cartes.length;
      etat.cartes = [...etat.cartes.filter(c => vues.has(c.url)), ...q.cartes.filter(c => !etat.cartes.some(x => x.url === c.url))];
      sauverEtat(); majFile();
    }
    etat.cartes = etat.cartes.filter(c => vues.has(c.url)); sauverEtat(); majFile();
  } catch (e) {
    if (!etat.cartes.length) scene.innerHTML = '<p class="vide">Connexion impossible (' + esc(e.message) + ').<br>Réessaie dans un instant.</p>';
    else reste.textContent = (file.length) + ' à trier · hors ligne';
  }
}
function filtrer() {
  const n = document.getElementById('f-niveau').value;
  file = toutes.filter(c => !n || c.niveau === n);
  if (vue === 'trier') afficher(); else gardees();
}
async function gardees() {
  const liste = await api.gardees();
  reste.textContent = liste.length + ' gardées';
  document.querySelector('footer').style.display = 'none';
  scene.innerHTML = '<div class="liste">' + (liste.map(c => `
    <div class="gardee">${c.photo ? `<img src="${esc(c.photo)}" referrerpolicy="no-referrer" alt="">` : ''}
      <div><b>${esc(c.titre || c.url)}</b>
        ${c.prix ? eur(c.prix) : ''} ${c.marge_prud ? '· marge ' + eur(c.marge_prud) : ''}<br>
        <select data-url="${esc(c.url)}">${Object.entries(STATUTS).map(([k, t]) =>
          `<option value="${k}" ${k === c.statut ? 'selected' : ''}>${t}</option>`).join('')}</select>
        <a href="${esc(c.url)}" target="_blank" rel="noopener">Ouvrir</a></div></div>`).join('')
    || '<p class="vide">Rien de gardé pour l’instant.</p>') + '</div>';
  scene.querySelectorAll('select').forEach(s => s.onchange = () => api.statut(s.dataset.url, s.value));
}
function onglet(v) {
  vue = v;
  document.getElementById('n-trier').classList.toggle('on', v === 'trier');
  document.getElementById('n-gardees').classList.toggle('on', v === 'gardees');
  document.querySelector('footer').style.display = v === 'trier' ? 'flex' : 'none';
  filtrer();
}
document.getElementById('n-trier').onclick = () => onglet('trier');
document.getElementById('n-gardees').onclick = () => onglet('gardees');
function afficher() {
  courante = file[0] || null;
  reste.textContent = file.length ? file.length + ' à trier' : '';
  if (!courante) {
    scene.innerHTML = '<p class="vide">Plus rien à trier.<br>Reviens après le prochain balayage.<br><small>(' + esc(diag) + ' · filtre : ' + esc(document.getElementById('f-niveau').value || 'tous') + ')</small></p>';
    return;
  }
  const c = courante;
  const infos = [
    c.n_annonces + ' annonces comparées · fourchette ' + eur(c.argus_p25) + ' – ' + eur(c.argus_p75),
    c.main_propre ? 'Retrait en main propre possible (port 0)' : null,
    c.argus_plafonne ? 'Argus ramené sous le prix neuf Thomann' : null,
    c.envoi === 'a_verifier' ? 'Envoi à vérifier avec le vendeur' : null,
    c.prix_reel_lu ? 'Prix lu dans le texte (affiché 1 €)' : null,
  ].filter(Boolean).map(t => '<span>' + esc(t) + '</span>').join('');
  const alertes = (c.signaux || []).map(s => '<span class="alerte">' + esc(SIGNAUX[s] || s) + '</span>').join('');
  scene.innerHTML = `
  <div class="carte" id="carte">
    <div class="etiquette" id="e-garder">GARDER</div>
    <div class="etiquette" id="e-rejeter">PASSER</div>
    <div class="etiquette" id="e-plus_tard">PLUS TARD</div>
    <span class="niveau ${esc(c.niveau)}">${NIVEAU[c.niveau] || ''}</span>
    <span class="source">${esc(c.source || '')}</span>
    ${c.photo ? `<div class="cadre-photo"><img class="photo" src="${esc(grandePhoto(c.photo))}" referrerpolicy="no-referrer" alt=""><button class="agrandir" data-photo="${esc(grandePhoto(c.photo))}">⤢ Agrandir</button></div>` : ''}
    <h1>${esc(c.titre)}</h1>
    <div class="lieu">${esc(c.lieu || '')} · ${esc(c.marque)} ${esc(c.modele)}</div>
    <div class="prix">
      <div><small>Prix annonce</small><strong>${eur(c.prix)}</strong></div>
      <div><small>Argus</small><strong>${eur(c.argus_med)}</strong></div>
      <div class="marge"><small>Marge prudente</small><strong>${eur(c.marge_prud ?? c.marge_med)}</strong></div>
    </div>
    <p class="infos">${infos}</p>
    ${c.enchere ? `<p class="infos"><span><b>Enchère</b> · fin ${finEnchere(c.enchere.fin)} · mise actuelle ${eur(c.enchere.actuelle)}${c.enchere.nb != null ? ' (' + c.enchere.nb + ' mise' + (c.enchere.nb > 1 ? 's' : '') + ')' : ''}${c.enchere.plafond ? ' · <b>ne pas dépasser ' + eur(c.enchere.plafond) + '</b>' : ''}</span></p>` : ''}
    ${c.fourchette ? `<p class="infos"><span><b>Croisement des sites :</b> ${Object.entries(c.fourchette.sites).map(([s, v]) => esc(s) + ' ' + eur(v.med) + ' (' + v.n + ')').join(' · ')} → fourchette ${eur(c.fourchette.bas)} – ${eur(c.fourchette.haut)}</span></p>` : ''}
    ${c.revente ? `<p class="infos"><span><b>Revente conseillée : ${esc(c.revente.marche)}</b> — argus ${eur(c.revente.argus_med)} (${c.revente.n} annonces), marge prudente ${eur(c.revente.marge_prud)} après surcoût de transport</span></p>` : ''}
    ${alertes}
    <p></p>
    <a class="voir" href="${esc(c.url)}" target="_blank" rel="noopener">Ouvrir l’annonce</a>
  </div>`;
  brancherGeste(document.getElementById('carte'));
  const b = document.querySelector('.agrandir');
  if (b) b.onclick = () => { const v = document.getElementById('visionneuse');
    v.querySelector('img').src = b.dataset.photo; v.style.display = 'flex'; };
}
document.getElementById('visionneuse').onclick = e => { e.currentTarget.style.display = 'none'; };
// eBay donne des vignettes de 225 px : on demande la grande version (1 600 px) de la même photo
function grandePhoto(u) { return String(u).replace(/\/s-l\d+\.(jpg|jpeg|png|webp)(\?.*)?$/i, '/s-l1600.$1'); }

// Geste : glisser franchement à droite (garder) ou à gauche (passer). Un mouvement vertical (faire
// défiler, regarder la photo) n'est jamais un swipe ; un geste interrompu par le navigateur
// (pointercancel) n'en est pas un non plus. Vers le haut = « plus tard » à la souris seulement.
function brancherGeste(el) {
  let x0 = 0, y0 = 0, dx = 0, dy = 0, actif = false, sens = null, souris = false;
  const remettre = () => {
    actif = false; sens = null; el.classList.remove('glisse'); el.style.transform = '';
    ['garder', 'rejeter', 'plus_tard'].forEach(d => montrer(d, 0));
  };
  el.addEventListener('pointerdown', e => {
    if (e.target.closest('a, button')) return;
    actif = true; sens = null; x0 = e.clientX; y0 = e.clientY; dx = dy = 0;
    souris = e.pointerType === 'mouse';
    el.classList.add('glisse');
  });
  el.addEventListener('pointermove', e => {
    if (!actif) return;
    dx = e.clientX - x0; dy = e.clientY - y0;
    if (!sens && Math.hypot(dx, dy) > 14) {
      sens = Math.abs(dx) > Math.abs(dy) * 1.3 ? 'h' : 'v';
      if (sens === 'v' && !souris) { remettre(); return; }  // défilement : on laisse faire
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
    }
    if (!sens) return;
    const vy = sens === 'v' ? Math.min(dy, 0) : 0;
    el.style.transform = `translate(${sens === 'h' ? dx : 0}px,${vy}px) rotate(${sens === 'h' ? dx / 25 : 0}deg)`;
    const s = seuil();
    montrer('garder', sens === 'h' ? dx / s : 0); montrer('rejeter', sens === 'h' ? -dx / s : 0);
    montrer('plus_tard', sens === 'v' ? -dy / 160 : 0);
  });
  el.addEventListener('pointerup', () => {
    if (!actif) return;
    const s = seuil(), h = sens === 'h', v = sens === 'v' && souris;
    actif = false; el.classList.remove('glisse');
    if (h && dx > s) decider('garder');
    else if (h && dx < -s) decider('rejeter');
    else if (v && dy < -160) decider('plus_tard');
    else remettre();
  });
  el.addEventListener('pointercancel', remettre);  // jamais de décision sur un geste interrompu
}
const seuil = () => Math.max(110, window.innerWidth * 0.3);
function montrer(d, v) { const e = document.getElementById('e-' + d); if (e) e.style.opacity = Math.max(0, Math.min(1, v)); }

async function envoyer(url, decision, motif, carte) {
  await api.swipe(url, decision, motif, carte);
}

// --- Retour en arrière : les 30 derniers swipes, du plus récent au plus ancien
const CLE_PILE = 'sdradar_pile';
let pile = [];
try { pile = JSON.parse(localStorage.getItem(CLE_PILE) || '[]'); } catch (e) { pile = []; }
function sauverPile() { try { localStorage.setItem(CLE_PILE, JSON.stringify(pile.slice(-30))); } catch (e) {} majRetour(); }
function majRetour() { const b = document.getElementById('b-retour'); if (b) b.disabled = !pile.length; }
function empiler(c) { pile.push(c); sauverPile(); }
async function retour() {
  const c = pile.pop(); sauverPile();
  if (!c) return;
  toast.style.display = 'none';
  await api.annuler(c.url);
  toutes = [c, ...toutes.filter(x => x.url !== c.url)];
  file = [c, ...file.filter(x => x.url !== c.url)];
  courante = null; afficher();
}
document.getElementById('b-retour').onclick = retour;
majRetour();

function decider(decision) {
  if (!courante) return;
  const c = courante, el = document.getElementById('carte');
  const sortie = { garder: 'translate(140vw,0)', rejeter: 'translate(-140vw,0)', plus_tard: 'translate(0,-120vh)' }[decision];
  el.classList.remove('glisse'); el.style.transform = sortie;
  const snap = { titre: c.titre, prix: c.prix, argus_med: c.argus_med, marge_prud: c.marge_prud,
    photo: c.photo, lieu: c.lieu, source: c.source, marque: c.marque, modele: c.modele };
  envoyer(c.url, decision, null, snap);
  empiler(c);
  dernierSwipe = c; file.shift(); toutes = toutes.filter(x => x.url !== c.url);
  setTimeout(afficher, 180);
  proposerMotif(c, decision);
}

function proposerMotif(c, decision) {
  clearTimeout(tToast);
  const motifs = decision === 'rejeter'
    ? [['trop_cher', 'Trop cher'], ['pas_interesse', 'Pas intéressé'], ['etat', 'État'], ['arnaque', 'Arnaque']] : [];
  toast.innerHTML = '<span>' + ({garder:'Gardé',rejeter:'Passé',plus_tard:'Plus tard'}[decision]) + '</span>' +
    motifs.map(([k, t]) => `<button data-m="${k}">${t}</button>`).join('') + '<button data-m="annuler">Annuler</button>';
  toast.style.display = 'flex';
  toast.querySelectorAll('button').forEach(b => b.onclick = async () => {
    if (b.dataset.m === 'annuler') {
      await api.annuler(c.url);
      pile = pile.filter(x => x.url !== c.url); sauverPile();
      file.unshift(c); afficher();
    } else await envoyer(c.url, 'rejeter', b.dataset.m);
    toast.style.display = 'none';
  });
  tToast = setTimeout(() => toast.style.display = 'none', 6000);
}

document.getElementById('b-garder').onclick = () => decider('garder');
document.getElementById('b-rejeter').onclick = () => decider('rejeter');
document.getElementById('b-plus_tard').onclick = () => decider('plus_tard');
addEventListener('keydown', e => ({ ArrowRight: 'garder', ArrowLeft: 'rejeter', ArrowUp: 'plus_tard' }[e.key] &&
  decider({ ArrowRight: 'garder', ArrowLeft: 'rejeter', ArrowUp: 'plus_tard' }[e.key])));
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
charger();
</script>
