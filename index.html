<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SD Radar</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { --fond:#101114; --carte:#1c1e24; --creux:#14161a; --texte:#f4f5f7; --doux:#b6bac4; --ligne:#3a3e48;
          --sombre:#2a2d35; --accent:#ffd166; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--fond); color:var(--texte); font:16px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;
         height:100dvh; display:flex; flex-direction:column; overflow:hidden; overscroll-behavior:none; }
  button { font:inherit; cursor:pointer; }
  header { padding:calc(8px + env(safe-area-inset-top)) 16px 6px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex:none; }
  header b { font-size:18px; letter-spacing:.5px; }
  #reste { color:var(--doux); font-size:14px; margin-left:10px; }
  #b-menu { width:44px; height:44px; border-radius:12px; border:2px solid var(--ligne); background:transparent; color:var(--texte); font-size:20px; font-weight:700; }
  #menu { position:fixed; right:16px; top:64px; background:var(--carte); border:2px solid var(--ligne); border-radius:12px; padding:6px; display:none; flex-direction:column; z-index:20; min-width:200px; }
  #menu a, #menu button { display:block; width:100%; text-align:left; padding:12px; border:0; background:transparent; color:var(--texte); text-decoration:none; font-size:15px; border-radius:8px; }
  #menu a:hover, #menu button:hover { background:var(--creux); }
  .puces { display:flex; gap:8px; padding:0 16px 8px; overflow-x:auto; scrollbar-width:none; flex:none; }
  .puces::-webkit-scrollbar { display:none; }
  .puce { height:36px; padding:0 14px; border-radius:18px; border:2px solid var(--ligne); background:transparent; color:var(--texte); font-size:14px; white-space:nowrap; flex:none; }
  .puce[aria-pressed="true"] { background:#fff; color:#101114; border-color:#fff; font-weight:700; }
  .puce.tiret { border-style:dashed; border-color:var(--doux); }
  main { flex:1; position:relative; min-height:0; padding:0 16px; }
  main.liste-vue { overflow-y:auto; padding-bottom:16px; }
  /* --- la pile : carte derrière, carte devant --- */
  .carte { position:absolute; left:16px; right:16px; top:4px; bottom:16px; background:var(--carte); border:2px solid var(--ligne);
           border-radius:20px; overflow:hidden; display:flex; flex-direction:column; will-change:transform; touch-action:pan-y; }
  .carte.derriere { transform:scale(.96) translateY(14px); border-color:var(--sombre); background:#16181d; }
  .carte.derriere > * { visibility:hidden; }
  .carte.devant { transition:transform .22s ease-out; z-index:2; }
  .carte.devant.glisse { transition:none; }
  .photo-zone { position:relative; flex:none; height:min(34vh, 270px); background:#0b0c0f; display:flex; align-items:center; justify-content:center; touch-action:none; user-select:none; }
  .photo-zone img { width:100%; height:100%; object-fit:contain; pointer-events:none; }
  .photo-zone .vide-photo { color:#6f7380; font-size:13px; }
  .pastille { position:absolute; top:12px; font-size:12px; font-weight:800; padding:4px 10px; border-radius:6px; letter-spacing:.5px; }
  .pastille.niveau { left:12px; background:#fff; color:#101114; }
  .pastille.niveau.a_voir { background:transparent; color:#fff; border:2px dashed #fff; }
  .pastille.source { right:12px; background:rgba(16,17,20,.85); color:var(--texte); font-weight:500; letter-spacing:0; }
  .points { position:absolute; bottom:10px; left:0; right:0; display:flex; justify-content:center; gap:6px; }
  .points span { width:8px; height:8px; border-radius:4px; background:#4a4e58; }
  .points span.on { background:#fff; }
  .agrandir { position:absolute; right:10px; bottom:8px; background:rgba(0,0,0,.75); color:#fff; border:2px solid #fff; border-radius:8px; padding:6px 10px; font-size:13px; }
  .corps { flex:1; min-height:0; overflow-y:auto; padding:12px 16px 14px; display:flex; flex-direction:column; gap:10px; }
  .verdict { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .verdict .gros { font-size:34px; font-weight:800; line-height:1; color:var(--accent); }
  .verdict .gros.neutre { color:var(--texte); }
  .verdict .detail { font-size:14px; color:var(--doux); text-align:right; }
  .verdict .detail b { color:var(--texte); }
  .jauge { position:relative; height:22px; }
  .jauge .rail { position:absolute; left:0; right:0; top:9px; height:4px; background:var(--sombre); border-radius:2px; }
  .jauge .bande { position:absolute; top:7px; height:8px; background:#6f7380; border-radius:4px; }
  .jauge .mediane { position:absolute; top:2px; width:2px; height:18px; background:var(--texte); }
  .jauge .point { position:absolute; top:0; width:22px; height:22px; margin-left:-11px; border-radius:11px; background:var(--accent); border:3px solid #101114; }
  .legende { display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--doux); flex-wrap:wrap; }
  .legende span { white-space:nowrap; }
  .legende b { color:var(--texte); }
  .legende b.prix { color:var(--accent); }
  h1 { font-size:18px; line-height:1.25; margin:0; word-break:break-word; user-select:text; }
  .sous { font-size:14px; color:var(--doux); }
  .etiquettes { display:flex; gap:6px; flex-wrap:wrap; }
  .etiquettes span { font-size:12px; padding:4px 8px; border-radius:6px; border:2px solid var(--ligne); }
  .etiquettes span.fort { background:var(--accent); color:#101114; border-color:var(--accent); font-weight:700; }
  .etiquettes span.alerte { background:#fff; color:#101114; border-color:#fff; font-weight:700; }
  .details-btn { display:flex; justify-content:space-between; align-items:center; width:100%; min-height:44px; padding:0 12px; border-radius:10px; border:2px solid var(--ligne); background:transparent; color:var(--texte); font-size:14px; font-weight:600; text-align:left; }
  .details { display:none; flex-direction:column; gap:6px; font-size:14px; color:var(--doux); }
  .details.ouvert { display:flex; }
  .details b { color:var(--texte); }
  a.voir { display:block; text-align:center; padding:12px; border:2px solid var(--texte); border-radius:10px; color:var(--texte); text-decoration:none; font-weight:600; }
  .etiquette { position:absolute; top:18px; padding:4px 12px; border:3px solid; border-radius:8px; font-weight:800; font-size:20px; opacity:0; transform:rotate(-8deg); background:var(--carte); z-index:3; pointer-events:none; }
  #e-garder { right:16px; color:#fff; border-color:#fff; }
  #e-rejeter { left:16px; color:var(--doux); border-style:dashed; border-color:var(--doux); }
  #e-plus_tard { left:50%; margin-left:-48px; color:var(--accent); border-color:var(--accent); }
  .vide { text-align:center; color:var(--doux); padding:40px 16px; }
  /* --- actions et navigation --- */
  footer { display:flex; align-items:center; justify-content:center; gap:14px; padding:10px 16px 8px; flex:none; }
  footer button { border-radius:50%; font-weight:800; display:flex; align-items:center; justify-content:center; }
  #b-retour { width:48px; height:48px; border:2px solid var(--ligne); background:transparent; color:var(--doux); font-size:20px; }
  #b-rejeter { width:68px; height:68px; border:3px dashed var(--doux); background:var(--sombre); color:var(--texte); font-size:15px; }
  #b-plus_tard { width:56px; height:56px; border:2px solid var(--accent); background:transparent; color:var(--accent); font-size:12px; }
  #b-garder { width:68px; height:68px; border:3px solid #fff; background:#fff; color:#101114; font-size:15px; }
  footer button:disabled { opacity:.35; }
  nav.bas { display:flex; justify-content:space-around; align-items:center; padding:4px 8px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--sombre); flex:none; }
  nav.bas button { background:transparent; border:0; color:var(--doux); font-size:13px; font-weight:700; padding:10px 12px; border-bottom:3px solid transparent; }
  nav.bas button[aria-pressed="true"] { color:#fff; border-bottom-color:#fff; }
  /* --- listes (chasseur, prises, argus) --- */
  .liste { width:100%; max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }
  .bloc { background:var(--carte); border:2px solid var(--ligne); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .bloc h2 { margin:0; font-size:17px; line-height:1.2; }
  .ligne { display:flex; gap:10px; align-items:center; padding:8px; border-radius:10px; background:var(--creux); text-decoration:none; color:var(--texte); }
  .ligne.manche { border:2px dashed var(--ligne); }
  .ligne img, .ligne .vignette { width:56px; height:56px; border-radius:8px; object-fit:cover; background:#0b0c0f; flex:none; }
  .ligne .txt { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .ligne b { font-size:14px; line-height:1.2; word-break:break-word; }
  .ligne small { font-size:13px; color:var(--doux); }
  .ligne .ratio { font-size:12px; font-weight:800; color:var(--accent); flex:none; }
  .fiche-dash label { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:14px; }
  .fiche-dash input, .fiche-dash select { width:9em; min-height:36px; background:#14161a; color:var(--texte); border:2px solid #3a3e48; border-radius:8px; padding:4px 8px; font:inherit; }
  .plus { min-height:40px; border-radius:10px; border:2px solid var(--ligne); background:transparent; color:var(--texte); font-size:14px; font-weight:600; }
  select, input { background:var(--creux); color:var(--texte); border:2px solid var(--ligne); border-radius:8px; padding:8px; font:inherit; font-size:14px; }
  /* --- toast, feuille des motifs, visionneuse --- */
  #toast { position:fixed; left:16px; right:16px; bottom:150px; background:#fff; color:#101114; border-radius:12px; padding:0 6px 0 14px; display:none; justify-content:space-between; align-items:center; min-height:44px; font-size:14px; font-weight:700; z-index:15; }
  #toast button { height:34px; padding:0 12px; border-radius:8px; border:2px solid #101114; background:#fff; color:#101114; font-weight:800; font-size:13px; }
  #motifs { position:fixed; left:0; right:0; bottom:0; background:var(--carte); border-top:2px solid var(--ligne); border-radius:16px 16px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); display:none; flex-direction:column; gap:10px; z-index:16; }
  #motifs p { margin:0; font-weight:700; }
  #motifs .choix { display:flex; gap:8px; flex-wrap:wrap; }
  #motifs .choix button { min-height:44px; padding:0 14px; border-radius:10px; border:2px solid var(--ligne); background:transparent; color:var(--texte); font-size:14px; font-weight:600; }
  #visionneuse { position:fixed; inset:0; background:#000; display:none; align-items:center; justify-content:center; z-index:30; }
  #visionneuse img { max-width:100%; max-height:100%; object-fit:contain; }
  #visionneuse .nav { position:absolute; top:50%; transform:translateY(-50%); width:56px; height:72px; background:rgba(0,0,0,.6); color:#fff; border:2px solid #fff; border-radius:10px; font-size:30px; }
  #v-prec { left:8px; } #v-suiv { right:8px; }
  #v-compte { position:absolute; top:14px; left:16px; color:#fff; font-size:15px; font-weight:700; }
  #v-fermer { position:absolute; top:14px; right:16px; color:#fff; font-size:15px; border:2px solid #fff; border-radius:8px; padding:6px 10px; background:transparent; }
  @media (prefers-reduced-motion: reduce) { .carte.devant { transition:none; } }
  /* --- deux grands onglets Matos · Immo (Immo vit dans son propre cadre : une erreur là-bas ne
     peut pas casser Matos) --- */
  .onglets-haut { flex:none; display:flex; gap:8px; padding:calc(6px + env(safe-area-inset-top)) 16px 0; }
  .onglets-haut button { flex:1; height:40px; border-radius:12px; border:2px solid var(--ligne); background:transparent; color:var(--doux); font-size:15px; font-weight:800; letter-spacing:.5px; }
  .onglets-haut button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#101114; }
  .onglets-haut ~ header { padding-top:8px; }
  #immo-cadre { position:fixed; left:0; right:0; bottom:0; width:100%; border:0; display:none; z-index:40; background:#e6f1fd; }
</style>
</head>
<body>
<nav class="onglets-haut" id="onglets-haut" aria-label="Matos ou Immo">
  <button id="o-matos" aria-pressed="true">Matos</button>
  <button id="o-immo" aria-pressed="false">Immo</button>
</nav>
<header><div><b>SD Radar</b><span id="reste"></span></div>
  <button id="b-menu" aria-label="Menu : argus, calcul Japon, réglages" aria-expanded="false">···</button></header>
<div id="menu" role="menu">
  <button id="m-argus" role="menuitem">Argus — rechercher un modèle</button>
  <a href="japon.html" role="menuitem">¥ Calcul Japon</a>
  <button id="m-config" role="menuitem">Réglages — lien du téléphone</button>
</div>
<div class="puces" id="puces">
  <button class="puce" data-niveau="" aria-pressed="true">Tous</button>
  <button class="puce" data-niveau="solide" aria-pressed="false">Solides</button>
  <button class="puce tiret" data-niveau="a_voir" aria-pressed="false">À vérifier</button>
  <button class="puce" id="p-encheres" aria-pressed="false">Enchères</button>
</div>
<main id="scene"></main>
<footer id="actions">
  <button id="b-retour" aria-label="Revenir à la carte précédente">↶</button>
  <button id="b-rejeter" aria-label="Passer (appui long : dire pourquoi)">Passer</button>
  <button id="b-plus_tard" aria-label="Plus tard">Plus tard</button>
  <button id="b-garder" aria-label="Garder">Garder</button>
</footer>
<nav class="bas" aria-label="Onglets">
  <button id="n-trier" aria-pressed="true">À trier</button>
  <button id="n-chasseur" aria-pressed="false">Chasseur</button>
  <button id="n-prises" aria-pressed="false">Mes prises</button>
  <button id="n-argus" aria-pressed="false">Argus</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="motifs" role="dialog" aria-label="Pourquoi passer ?"><p>Pourquoi passer ?</p><div class="choix"></div></div>
<div id="visionneuse"><img alt="" referrerpolicy="no-referrer"><button id="v-fermer">✕ Fermer</button><b id="v-compte"></b>
  <button class="nav" id="v-prec" aria-label="Photo précédente">‹</button><button class="nav" id="v-suiv" aria-label="Photo suivante">›</button></div>
<script>
// --- Accès aux données : serveur local (/api) ou Supabase (lien de configuration du téléphone)
const CLE_CFG = 'sdradar_cfg';
function enregistrerLien(texte) {
  const m = String(texte).match(/cfg=([\w-]+=*)/);
  if (!m) return false;
  try {
    const cfg = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')))));
    if (!cfg.u || !cfg.k || !cfg.t) return false;
    localStorage.setItem(CLE_CFG, JSON.stringify(cfg));
    return true;
  } catch (e) { return false; }
}
if (location.hash.includes('cfg=')) {
  enregistrerLien(location.hash);
  history.replaceState(null, '', location.pathname);
}
const SERVEUR_LOCAL = /^(localhost|127\.|192\.168\.|10\.)/.test(location.hostname);
let CFG = null;
try { CFG = JSON.parse(localStorage.getItem(CLE_CFG) || 'null'); } catch (e) { CFG = null; }
async function rpc(nom, args) {
  const r = await fetch(`${CFG.u}/rest/v1/rpc/${nom}`, { method: 'POST', signal: AbortSignal.timeout(40000),
    headers: { apikey: CFG.k, Authorization: 'Bearer ' + CFG.k, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_jeton: CFG.t, ...args }) });
  if (!r.ok) throw new Error('Supabase ' + r.status);
  return r.status === 204 ? null : r.json();
}
// --- Cache local : les cartes s'affichent tout de suite, même réseau lent ; les décisions prises
// hors ligne attendent dans une file et partent dès que la connexion revient.
const CLE_CACHE = 'sdradar_cache', CLE_FILE = 'sdradar_file';
function lire(cle, defaut) { try { return JSON.parse(localStorage.getItem(cle)) ?? defaut; } catch (e) { return defaut; } }
function ecrire(cle, v) { try { localStorage.setItem(cle, JSON.stringify(v)); } catch (e) { diag = 'mémoire du téléphone pleine'; } }
let etat = lire(CLE_CACHE, null) || { cartes: [], swipes: {}, total: 0 };
const sauverEtat = () => ecrire(CLE_CACHE, etat);
async function rpcSur(nom, args) {  // écriture : si le réseau échoue, on la garde pour plus tard
  const file = lire(CLE_FILE, []);
  file.push({ nom, args }); ecrire(CLE_FILE, file);
  await viderFile();
}
let envoiEnCours = false;
async function viderFile() {
  if (envoiEnCours) return;
  envoiEnCours = true;
  try {
    let file = lire(CLE_FILE, []);
    while (file.length) {
      try { await rpc(file[0].nom, file[0].args); } catch (e) { break; }
      file = lire(CLE_FILE, []).slice(1); ecrire(CLE_FILE, file);
    }
  } finally { envoiEnCours = false; }
}
// Décisions pas encore parties : réappliquées sur l'état reçu du serveur (sinon une carte triée
// hors ligne revenait dans la pile)
function appliquerFile(swipes) {
  for (const { nom, args } of lire(CLE_FILE, [])) {
    if (nom === 'radar_swipe') swipes[args.p_url] = { decision: args.p_decision, motif: args.p_motif, le: new Date().toISOString(),
      ...(args.p_decision === 'garder' ? { statut: 'a_contacter', carte: args.p_carte || {} } : {}) };
    else if (nom === 'radar_annuler') delete swipes[args.p_url];
    else if (nom === 'radar_statut' && swipes[args.p_url]) swipes[args.p_url].statut = args.p_statut;
  }
  return swipes;
}
addEventListener('online', viderFile);
const ORDRE = { solide: 0, a_voir: 1 };
function aTrier(cartes, swipes) {
  const maintenant = Date.now();
  return cartes.filter(c => ORDRE[c.niveau] !== undefined)
    .filter(c => !c.enchere || Date.parse(c.enchere.fin) > maintenant).filter(c => {
    const s = swipes[c.url];
    if (!s) return true;
    return s.decision === 'plus_tard' && maintenant - Date.parse(s.le) > 24 * 3600e3;
  }).sort((a, b) => ORDRE[a.niveau] - ORDRE[b.niveau] || (b.marge_prud || 0) - (a.marge_prud || 0));
}
const api = {
  async cartes() {
    if (!CFG) return (await fetch('/api/cartes')).json();
    return aTrier(etat.cartes, etat.swipes);
  },
  async gardees() {
    if (!CFG) return (await fetch('/api/gardees')).json();
    return Object.entries(etat.swipes).filter(([, s]) => s.decision === 'garder')
      .map(([url, s]) => ({ url, statut: s.statut || 'a_contacter', le: s.le, ...(s.carte || {}) }))
      .sort((a, b) => b.le.localeCompare(a.le));
  },
  async swipe(url, decision, motif, carte) {
    if (!CFG) return fetch('/api/swipe', { method: 'POST', body: JSON.stringify({ url, decision, motif, carte }) });
    etat.swipes[url] = { decision, motif: motif || null, le: new Date().toISOString(),
      ...(decision === 'garder' ? { statut: 'a_contacter', carte: carte || {} } : {}) };
    sauverEtat();
    return rpcSur('radar_swipe', { p_url: url, p_decision: decision, p_motif: motif || null, p_carte: carte || {} });
  },
  async annuler(url) {
    if (!CFG) return fetch('/api/annuler', { method: 'POST', body: JSON.stringify({ url }) });
    delete etat.swipes[url]; sauverEtat();
    return rpcSur('radar_annuler', { p_url: url });
  },
  async statut(url, statut) {
    if (!CFG) return fetch('/api/statut', { method: 'POST', body: JSON.stringify({ url, statut }) });
    if (etat.swipes[url]) { etat.swipes[url].statut = statut; sauverEtat(); }
    return rpcSur('radar_statut', { p_url: url, p_statut: statut });
  },
};
const $ = id => document.getElementById(id);
const scene = $('scene'), reste = $('reste'), toast = $('toast');
let file = [], courante = null, tToast = null, enCours = false;
const NIVEAU = { solide: 'SOLIDE', a_voir: 'À VÉRIFIER' };
const SIGNAUX = { prix_lt_50pct_argus: 'Prix < 50 % de l’argus : méfiance' };
const SOURCES = { ebay: 'eBay', ebay_enchere: 'eBay · enchère', ebay_de: 'eBay DE', ebay_gb: 'eBay UK', ebay_us: 'eBay US', ebay_it: 'eBay IT',
  reverb: 'Reverb', zikinf: 'Zikinf', mercatino: 'Mercatino', kleinanzeigen: 'Kleinanzeigen', marktplaats: 'Marktplaats', '2ememain': '2ememain', blocket: 'Blocket', finn: 'Finn', wallapop: 'Wallapop' };
const nomSource = s => SOURCES[s] || s;
const PAYS = { FR: 'France', DE: 'Allemagne', IT: 'Italie', ES: 'Espagne', NL: 'Pays-Bas', BE: 'Belgique', GB: 'Royaume-Uni', US: 'États-Unis', JP: 'Japon', SE: 'Suède', NO: 'Norvège' };
function finEnchere(fin) {
  const s = Math.round((Date.parse(fin) - Date.now()) / 1000);
  if (!(s > 0)) return 'terminée';
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return 'dans ' + (h >= 48 ? Math.floor(h / 24) + ' j' : h ? h + ' h ' + String(m).padStart(2, '0') : m + ' min');
}
const eur = n => Math.round(n).toLocaleString('fr-FR') + ' €';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function majFile() {  // nouvelles données : la carte affichée reste en tête, rien ne saute
  toutes = aTrier(etat.cartes, etat.swipes);
  const nouvelle = selection(toutes);
  if (courante && nouvelle.some(c => c.url === courante.url)) {
    file = [courante, ...nouvelle.filter(c => c.url !== courante.url)];
    compter();
  } else { file = nouvelle; if (enDeck()) afficher(); }
}
async function chargerDistant() {
  if (etat.cartes.length) { diag = 'cache du téléphone'; toutes = aTrier(etat.cartes, etat.swipes); filtrer(); }
  else scene.innerHTML = '<p class="vide">Chargement des cartes…</p>';
  await viderFile();
  try {
    const p = await rpc('radar_page', { p_debut: 0, p_n: 40 });
    const premiere = p.cartes.map(c => c.url);
    etat.swipes = appliquerFile(p.swipes || {});
    etat.cartes = [...p.cartes, ...etat.cartes.filter(c => !premiere.includes(c.url))];
    etat.total = p.total; sauverEtat(); diag = `mode Supabase · ${p.total} cartes à trier`;
    majFile();
    let recues = p.cartes.length;
    const vues = new Set(premiere);
    while (recues < p.total) {
      const q = await rpc('radar_page', { p_debut: recues, p_n: 60 });
      if (!q.cartes.length) break;
      const fraiches = new Map(q.cartes.map(c => [c.url, c]));
      q.cartes.forEach(c => vues.add(c.url));
      recues += q.cartes.length;
      // une carte déjà en cache est remplacée par sa version fraîche (prix, enchère)
      etat.cartes = [...etat.cartes.filter(c => vues.has(c.url)).map(c => fraiches.get(c.url) || c),
                     ...q.cartes.filter(c => !etat.cartes.some(x => x.url === c.url))];
      sauverEtat(); majFile();
    }
    etat.cartes = etat.cartes.filter(c => vues.has(c.url)); sauverEtat(); majFile();
  } catch (e) {
    if (!etat.cartes.length) scene.innerHTML = '<p class="vide">Connexion impossible (' + esc(e.message) + ').<br>Réessaie dans un instant.</p>';
    else reste.textContent = file.length + ' à trier · hors ligne';
  }
}

    .sort((a, b) => Date.parse(a.enchere.fin) - Date.parse(b.enchere.fin));

// --- Geste : glisser à droite (garder) ou à gauche (passer), par la distance (30 % de l'écran) ou
// par la vitesse (un petit geste vif suffit). Vers le haut = « plus tard », au doigt depuis la
// photo (le reste de la carte défile verticalement), à la souris partout. Un geste interrompu
// par le navigateur (pointercancel) ne décide jamais.
function brancherGeste(el) {
  let x0 = 0, y0 = 0, dx = 0, dy = 0, actif = false, sens = null, surPhoto = false, souris = false;
  let tPrec = 0, xPrec = 0, vx = 0;
  const remettre = () => {
    actif = false; sens = null; el.classList.remove('glisse'); el.style.transform = '';
    ['garder', 'rejeter', 'plus_tard'].forEach(d => montrer(d, 0));
  };
  el.addEventListener('pointerdown', e => {
    if (e.target.closest('a, button')) return;
    actif = true; sens = null; x0 = xPrec = e.clientX; y0 = e.clientY; dx = dy = vx = 0; tPrec = e.timeStamp;
    souris = e.pointerType === 'mouse'; surPhoto = !!e.target.closest('.photo-zone');
    el.classList.add('glisse');
  });
  el.addEventListener('pointermove', e => {
    if (!actif) return;
    dx = e.clientX - x0; dy = e.clientY - y0;
    const dt = e.timeStamp - tPrec; if (dt > 0) { vx = (e.clientX - xPrec) / dt; tPrec = e.timeStamp; xPrec = e.clientX; }
    if (!sens && Math.hypot(dx, dy) > 14) {
      sens = Math.abs(dx) > Math.abs(dy) * 1.3 ? 'h' : 'v';
      if (sens === 'v' && !souris && !surPhoto) { remettre(); return; }  // défilement du contenu
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
    }
    if (!sens) return;
    const vy = sens === 'v' ? Math.min(dy, 0) : 0;
    el.style.transform = `translate(${sens === 'h' ? dx : 0}px,${vy}px) rotate(${sens === 'h' ? dx / 25 : 0}deg)`;
    const s = seuil();
    montrer('garder', sens === 'h' ? dx / s : 0); montrer('rejeter', sens === 'h' ? -dx / s : 0);
    montrer('plus_tard', sens === 'v' ? -dy / 140 : 0);
  });
  el.addEventListener('pointerup', () => {
    if (!actif) return;
    const s = seuil(), h = sens === 'h', v = sens === 'v';
    actif = false; el.classList.remove('glisse');
    const vif = Math.abs(vx) > 0.6 && Math.abs(dx) > 40;  // px/ms
    if (h && (dx > s || (vif && dx > 0))) decider('garder');
    else if (h && (dx < -s || (vif && dx < 0))) decider('rejeter');
    else if (v && dy < -140) decider('plus_tard');
    else remettre();
  });
  el.addEventListener('pointercancel', remettre);
}
const seuil = () => Math.max(110, window.innerWidth * 0.3);

function decider(decision, motif) {
  if (!courante || enCours) return;  // un double appui ne saute plus une carte
  enCours = true;
  const c = courante, el = $('carte');
  courante = null;
  const sortie = { garder: 'translate(140vw,0) rotate(12deg)', rejeter: 'translate(-140vw,0) rotate(-12deg)', plus_tard: 'translate(0,-120vh)' }[decision];
  el.classList.remove('glisse'); el.style.transform = sortie;
  vibrer(12);
  const snap = { titre: c.titre, prix: c.prix, argus_med: c.argus_med, marge_prud: c.marge_prud,
    photo: c.photo, lieu: c.lieu, source: c.source, marque: c.marque, modele: c.modele };
  api.swipe(c.url, decision, motif || null, snap);
  empiler(c);
  file.shift(); toutes = toutes.filter(x => x.url !== c.url);
  setTimeout(afficher, 200);
  confirmer(c, decision, motif);
}
const LIBELLE = { garder: 'Gardée', rejeter: 'Passée', plus_tard: 'Plus tard' };

  toast.innerHTML = `<span>${LIBELLE[decision]}${m ? ' · « ' + m[1] + ' »' : ''}</span><button>Annuler</button>`;
  toast.style.display = 'flex';

    toast.style.display = 'none';

document.addEventListener('click', e => { if (motifs.style.display === 'flex' && !e.target.closest('#motifs, #b-rejeter')) motifs.style.display = 'none'; });
$('b-garder').onclick = () => decider('garder');
$('b-plus_tard').onclick = () => decider('plus_tard');
addEventListener('keydown', e => {
  if (e.key === 'Escape') { fermerPhotos(); ouvrirMenu(false); motifs.style.display = 'none'; return; }
  if (visionneuseOuverte()) { if (e.key === 'ArrowRight') decaler(1); if (e.key === 'ArrowLeft') decaler(-1); return; }
  if (!enDeck() || e.target.matches('input, textarea, select')) return;
  const d = { ArrowRight: 'garder', ArrowLeft: 'rejeter', ArrowUp: 'plus_tard' }[e.key];
  if (d) decider(d);
});

// --- Argus : recherche dans le catalogue, argus le plus récent de chaque modèle
function argus() {
  reste.textContent = '';
  scene.className = 'liste-vue';
  scene.innerHTML = `<div class="liste">
    <input id="a-q" placeholder="Modèle : ex. Klon Centaur, JEM 20th, Stratocaster CBS 1976" autocomplete="off" style="width:100%;padding:10px">
    <p class="sous" style="margin:0">Prix demandés (pas des ventes). Moins de 3 annonces : argus peu fiable.</p>
    <div id="a-res" class="liste"></div></div>`;
  let t;
  $('a-q').oninput = e => { clearTimeout(t); t = setTimeout(async () => {
    const q = e.target.value.trim(), zone = $('a-res');
    if (q.length < 3) { zone.innerHTML = ''; return; }
    zone.innerHTML = '<p class="sous">Recherche…</p>';
    try {
      const r = CFG ? await rpc('radar_modeles', { p_q: q }) : await (await fetch('/api/modeles?q=' + encodeURIComponent(q))).json();
      zone.innerHTML = r.map(m => `<div class="ligne"><div class="txt"><b>${esc(m.marque)} ${esc(m.modele)}</b>
        <small>${m.mediane ? 'Argus <b>' + eur(m.mediane) + '</b>' + (m.p25 ? ' · fourchette basse ' + eur(m.p25) : '') : 'pas d’argus'}
        · ${m.n || 0} annonce${(m.n || 0) > 1 ? 's' : ''}${(m.n || 0) < 3 ? ' · <b style="text-decoration:underline">peu fiable</b>' : ''}</small></div></div>`).join('')
        || '<p class="sous">Aucun modèle trouvé.</p>';
    } catch (err) { zone.innerHTML = '<p class="sous">Recherche indisponible : ' + esc(err.message) + '</p>'; }
  }, 400); };
  $('a-q').focus();
}
// --- Chasseur : une fiche = un bloc replié (compteurs, filtres), pas 900 lignes d'un coup
async function lireChasse() {
  try {
    const c = CFG ? await rpc('radar_lire_config', {}) : await (await fetch('/api/config')).json();
    try { localStorage.setItem('sdradar_config', JSON.stringify(c)); } catch (e) {}
    return c.chasse;
  } catch (e) {
    try { return JSON.parse(localStorage.getItem('sdradar_config') || 'null').chasse; } catch (x) { return null; }
  }
}
const chFiltre = {};  // id de fiche → 'budget' | 'proches' | 'manches'
const chNombre = {};  // id de fiche → lignes affichées
const PAR_PAGE = 25;
function sousEnsemble(f) {
  const k = chFiltre[f.id] || 'budget';
  return f.resultats.filter(r => k === 'manches' ? r.nature === 'manche'
    : k === 'proches' ? r.nature !== 'manche' && !r.dans_budget && r.au_dessus_pct
    : r.nature !== 'manche' && (r.dans_budget || !r.au_dessus_pct && f.prix_max == null));
}
function ligneChasse(r) {
  const img = r.photos && r.photos.length && surHttp(r.photos[0]) ? `<img src="${esc(vignette(r.photos[0]))}" loading="lazy" referrerpolicy="no-referrer" alt="">` : '<span class="vignette"></span>';
  const ratio = r.prix != null && r.plafond ? Math.round(r.prix / r.plafond * 100) : null;
  const detail = [r.prix != null ? eur(r.prix) : 'prix ?', r.prix_origine ? '(' + esc(r.prix_origine) + ')' : '', nomSource(r.source), r.lieu,
    r.nature === 'manche' ? '<b style="text-decoration:underline">manche seul</b>' : r.au_dessus_pct ? '<b>+' + r.au_dessus_pct + ' % au-dessus du plafond</b>' : r.dans_budget ? '' : '<b style="text-decoration:underline">hors budget</b>',
    r.enchere && r.enchere.fin ? 'enchère, fin ' + finEnchere(r.enchere.fin) : '',
    r.aussi_sur && r.aussi_sur.length ? 'aussi sur ' + r.aussi_sur.map(x => esc(x.source)).join(', ') : ''].filter(Boolean).map(x => x.startsWith('<') ? x : esc(x)).join(' · ');
  return `<a class="ligne ${r.nature === 'manche' ? 'manche' : ''}" href="${surHttp(r.url) ? esc(r.url) : '#'}" target="_blank" rel="noopener">${img}
    <span class="txt"><b>${esc(r.titre)}</b><small>${detail}</small></span>${ratio != null && r.nature !== 'manche' ? `<span class="ratio" title="du plafond">${ratio} %</span>` : ''}</a>`;
}
// Objets « à surveiller » du Dashboard matériel qui n'ont pas encore de fiche (lecture seule du
// vault) : rien n'est chassé tant qu'on n'a pas choisi, chaque fiche allonge le passage.
function blocPropositions(ps) {
  if (!ps || !ps.length) return '';
  const le = ps[0].le;
  return `<section class="bloc"><div><h2>Depuis ta liste à surveiller</h2>
    <small class="sous">${ps.length} objet${ps.length > 1 ? 's' : ''} du Dashboard matériel${le ? ' (' + new Date(le).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) + ')' : ''} sans recherche. Dis à Claude lesquels chasser, avec un budget.</small></div>
    ${ps.map(p => `<div class="ligne" style="cursor:default"><span class="vignette"></span><span class="txt"><b>${esc(p.nom)}</b>${p.notes ? `<small>${esc(p.notes)}</small>` : ''}</span></div>`).join('')}
  </section>`;
}
let chasseCache = null;
async function chasseur() {
  scene.className = 'liste-vue';
  if (!chasseCache) { scene.innerHTML = '<p class="vide">Chargement des recherches…</p>'; chasseCache = await lireChasse(); }
  const ch = chasseCache;
  if (vue !== 'chasseur') return;
  if (!ch || !ch.fiches) { scene.innerHTML = '<p class="vide">Pas encore de recherche chasseur.</p>'; reste.textContent = ''; return; }
  const total = ch.fiches.reduce((n, f) => n + f.resultats.length, 0);
  reste.textContent = total + ' trouvée' + (total > 1 ? 's' : '');
  scene.innerHTML = '<div class="liste">' + ch.fiches.map(f => {
    const n = { budget: f.resultats.filter(r => r.nature !== 'manche' && (r.dans_budget || !r.au_dessus_pct && f.prix_max == null)).length,
      proches: f.resultats.filter(r => r.nature !== 'manche' && !r.dans_budget && r.au_dessus_pct).length,
      manches: f.resultats.filter(r => r.nature === 'manche').length };
    const k = chFiltre[f.id] || 'budget', lignes = sousEnsemble(f), max = chNombre[f.id] || PAR_PAGE;
    return `<section class="bloc" data-f="${esc(f.id)}"><div><h2>${esc(f.nom)}</h2>
      <small class="sous">${f.prix_max ? 'Budget ' + eur(f.prix_max) : 'Pas de budget'} · ${f.resultats.length} annonce${f.resultats.length > 1 ? 's' : ''}${f.pour && f.pour !== 'moi' ? ' · pour ' + esc(f.pour) : ''}</small></div>
      <div class="etiquettes" style="gap:6px">
        <button class="puce" data-k="budget" aria-pressed="${k === 'budget'}">${f.prix_max ? 'Sous plafond' : 'Toutes'} · ${n.budget}</button>
        ${n.proches ? `<button class="puce" data-k="proches" aria-pressed="${k === 'proches'}">Proches · ${n.proches}</button>` : ''}
        ${n.manches ? `<button class="puce tiret" data-k="manches" aria-pressed="${k === 'manches'}">Manches · ${n.manches}</button>` : ''}
      </div>
      ${lignes.slice(0, max).map(ligneChasse).join('') || '<p class="sous" style="margin:0">Rien pour l’instant : la recherche est relancée à chaque mise à jour.</p>'}
      ${lignes.length > max ? `<button class="plus" data-plus="${esc(f.id)}">Voir ${Math.min(PAR_PAGE, lignes.length - max)} de plus (${lignes.length - max} restantes)</button>` : ''}
    </section>`;
  }).join('') + blocPropositions(ch.propositions) + `<p class="sous" style="text-align:center">Dernière recherche : ${new Date(ch.le).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</p></div>`;
  scene.querySelectorAll('.puce[data-k]').forEach(b => b.onclick = () => { const id = b.closest('section').dataset.f; chFiltre[id] = b.dataset.k; chNombre[id] = PAR_PAGE; chasseur(); });
  scene.querySelectorAll('[data-plus]').forEach(b => b.onclick = () => { chNombre[b.dataset.plus] = (chNombre[b.dataset.plus] || PAR_PAGE) + PAR_PAGE; chasseur(); });
}
// --- Mes prises (ex-« Gardées ») : étapes en pastilles, parcours du prix
let prisesFiltre = '';
async function prises() {
  const liste = await api.gardees();
  if (vue !== 'prises') return;
  scene.className = 'liste-vue';
  const comptes = {}; liste.forEach(c => comptes[c.statut] = (comptes[c.statut] || 0) + 1);
  const visibles = liste.filter(c => !prisesFiltre || c.statut === prisesFiltre);
  reste.textContent = liste.length + ' prise' + (liste.length > 1 ? 's' : '');
  scene.innerHTML = `<div class="liste"><div class="puces" style="padding:0">
      <button class="puce" data-s="" aria-pressed="${!prisesFiltre}">Toutes · ${liste.length}</button>
      ${Object.entries(STATUTS).map(([k, t]) => comptes[k] ? `<button class="puce" data-s="${k}" aria-pressed="${prisesFiltre === k}">${t} · ${comptes[k]}</button>` : '').join('')}</div>
    ${visibles.map((c, i) => `<div class="bloc"><div class="ligne" style="padding:0;background:transparent">
      ${c.photo && surHttp(c.photo) ? `<img src="${esc(vignette(c.photo))}" loading="lazy" referrerpolicy="no-referrer" alt="">` : '<span class="vignette"></span>'}
      <span class="txt"><b>${esc(c.titre || c.url)}</b>
        <small>${[nomSource(c.source), c.lieu].filter(Boolean).map(esc).join(' · ')}${c.le ? ' · gardée le ' + new Date(c.le).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) : ''}</small>
        <small>${c.prix ? 'demandé <b>' + eur(c.prix) + '</b>' : ''}${c.argus_med ? ' → argus <b style="color:var(--accent)">' + eur(c.argus_med) + '</b>' : ''}${c.marge_prud ? ' · marge ' + eur(c.marge_prud) : ''}</small></span></div>
      <div style="display:flex;gap:8px;align-items:center">
        <select data-url="${esc(c.url)}" aria-label="Étape">${Object.entries(STATUTS).map(([k, t]) => `<option value="${k}" ${k === c.statut ? 'selected' : ''}>${t}</option>`).join('')}</select>
        <a class="voir" style="flex:1;padding:8px" href="${surHttp(c.url) ? esc(c.url) : '#'}" target="_blank" rel="noopener">Ouvrir ↗</a></div>
      ${c.statut === 'achete' ? `<button class="plus" data-fiche="${i}">Fiche pour le Dashboard matériel</button><div class="fiche-dash" hidden></div>` : ''}</div>`).join('')
      || '<p class="vide">Rien de gardé pour l’instant.</p>'}</div>`;
  scene.querySelectorAll('.puce[data-s]').forEach(b => b.onclick = () => { prisesFiltre = b.dataset.s; prises(); });
  scene.querySelectorAll('select[data-url]').forEach(s => s.onchange = async () => {
    await api.statut(s.dataset.url, s.value);
    if (s.value === 'achete' || s.closest('.bloc').querySelector('[data-fiche]')) prises();
  });
  scene.querySelectorAll('[data-fiche]').forEach(b => b.onclick = () => formulaireFiche(b.nextElementSibling, visibles[+b.dataset.fiche]));
}
// --- Acheté → fiche prête à coller dans le Dashboard matériel. Le radar n'écrit jamais dans le
// dashboard (règle sync-matos) : on copie la fiche et la donne à Claude, qui l'ajoute après
// confirmation. Champs et catégories du dashboard (inv_items, 2026-11-10).
const CAT_DASHBOARD = { guitares: 'Guitares', basses: 'Guitares', pedales_racks: 'Pédales & Racks',
  amplis: 'Amplis', accessoires: 'Accessoires', home_studio: 'Pédales & Racks',
  claviers_synthes: 'Divers SDMC', dj: 'Divers SDMC' };
function ficheDashboard(c, saisie) {
  const auj = new Date().toISOString().slice(0, 10);
  const valeur = c.argus_p25 || c.argus_med ? Math.round(c.argus_p25 || c.argus_med) : null;
  return {
    cat: CAT_DASHBOARD[c.famille] || 'Divers SDMC', marque: c.marque || '', modele: c.modele || '',
    statut: saisie.statut, prixAchat: saisie.prix, frais: saisie.frais, dateAchat: auj,
    vendeur: nomSource(c.source) || c.source || '', justificatif: c.url,
    valeur, valeurDate: valeur ? auj : null,
    valeurSource: valeur ? `SD Radar : ${c.argus_p25 ? 'bas de fourchette (p25)' : 'médiane'} sur ${c.n_annonces || '?'} annonces le ${auj}, à confirmer` : null,
    note: `Acheté via SD Radar : « ${c.titre || c.url} »${c.lieu ? ' (' + c.lieu + ')' : ''}`,
  };
}
function formulaireFiche(zone, c) {
  if (!zone.hidden) { zone.hidden = true; return; }
  zone.hidden = false;
  zone.innerHTML = `<div style="display:grid;gap:8px;margin-top:4px">
    <label>Prix payé (€) <input type="number" inputmode="decimal" data-k="prix" value="${Math.round(c.prix || 0)}"></label>
    <label>Frais : port, droits (€) <input type="number" inputmode="decimal" data-k="frais" value="0"></label>
    <label>Pour <select data-k="statut"><option value="PRO">SDMC (stock)</option><option value="PERSO">Moi (perso)</option></select></label>
    <textarea readonly rows="7" style="width:100%;background:#14161a;color:#fff;border:2px solid #3a3e48;border-radius:8px;padding:8px;font:12px ui-monospace,monospace"></textarea>
    <button class="plus" data-copier>Copier la fiche</button>
    <small class="sous">Colle-la à Claude : « ajoute cette fiche au Dashboard matériel ». Rien n'est écrit sans ta confirmation.</small></div>`;
  const champ = k => zone.querySelector(`[data-k="${k}"]`), texte = zone.querySelector('textarea');
  const maj = () => {
    const f = ficheDashboard(c, { prix: +champ('prix').value || 0, frais: +champ('frais').value || 0, statut: champ('statut').value });
    texte.value = 'Fiche pour le Dashboard matériel (à confirmer avant écriture) :\n' + JSON.stringify(f, null, 1);
  };
  zone.querySelectorAll('[data-k]').forEach(x => x.oninput = maj);
  maj();
  zone.querySelector('[data-copier]').onclick = async e => {
    try { await navigator.clipboard.writeText(texte.value); } catch (x) { texte.select(); document.execCommand('copy'); }
    e.target.textContent = 'Copiée ✓';
    setTimeout(() => { e.target.textContent = 'Copier la fiche'; }, 2000);
  };
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
charger();
</script>
<script>
// Onglets Matos · Immo. Script à part : rien ici ne touche au code de Matos. Immo est chargé dans
// un cadre (immo.html), seulement quand on l'ouvre ; le dernier onglet utilisé est mémorisé.
(function () {
  const CLE = 'sdradar_onglet';
  const bm = document.getElementById('o-matos'), bi = document.getElementById('o-immo');
  const barre = document.getElementById('onglets-haut');
  let cadre = null, onglet = 'matos';
  function placer() {  // un iframe ne s'étire pas avec top/bottom : hauteur explicite
    if (!cadre) return;
    const haut = barre.getBoundingClientRect().bottom;
    cadre.style.top = haut + 'px';
    cadre.style.height = (innerHeight - haut) + 'px';
  }
  function montrer(o) {
    onglet = o;
    try { localStorage.setItem(CLE, o); } catch (e) { /* mémoire pleine : sans gravité */ }
    bm.setAttribute('aria-pressed', String(o === 'matos'));
    bi.setAttribute('aria-pressed', String(o === 'immo'));
    if (o === 'immo' && !cadre) {
      cadre = document.createElement('iframe');
      cadre.id = 'immo-cadre'; cadre.title = 'Immo'; cadre.src = 'immo.html';
      document.body.appendChild(cadre);
    }
    if (cadre) { placer(); cadre.style.display = o === 'immo' ? 'block' : 'none'; if (o === 'immo') cadre.focus(); }
  }
  // Pendant qu'Immo est affiché, les flèches du clavier ne doivent pas trier les cartes Matos.
  addEventListener('keydown', e => { if (onglet === 'immo') e.stopImmediatePropagation(); }, true);
  addEventListener('resize', placer);
  bm.onclick = () => montrer('matos');
  bi.onclick = () => montrer('immo');
  let dernier = 'matos';
  try { dernier = localStorage.getItem(CLE) || 'matos'; } catch (e) { dernier = 'matos'; }
  if (dernier === 'immo') montrer('immo');
})();
</script>
